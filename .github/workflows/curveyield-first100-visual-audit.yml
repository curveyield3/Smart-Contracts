name: One-time Markets first 100 visual dapp audit
on:
  push:
    paths: [".github/workflows/curveyield-first100-visual-audit.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium browser
        run: |
          mkdir -p "$RUNNER_TEMP/market-review"
          cd "$RUNNER_TEMP/market-review"
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Render discovery UI and audit first 100 dapps
        timeout-minutes: 17
        run: |
          cat > "$RUNNER_TEMP/market-review/audit.mjs" <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const root=process.env.GITHUB_WORKSPACE+'/_audit_results';
          fs.mkdirSync(root,{recursive:true});
          const base='https://markets.curveyield.org', slp=t=>new Promise(r=>setTimeout(r,t));
          async function getApi(){
            for(let attempt=1;attempt<=4;attempt++){
              try{
                const r=await fetch(base+'/api/opportunities?sort=tvl&limit=100&offset=0',{signal:AbortSignal.timeout(100000),headers:{Accept:'application/json'}});
                if(!r.ok)throw Error('API HTTP '+r.status);
                const d=await r.json();
                if(!d.discoveryFilter?.singleAsset||d.discoveryFilter.aprGreaterThanPercent!==1||d.opportunities?.length!==100)throw Error('Expected complete filtered first 100');
                return d;
              }catch(e){console.log('API_RETRY '+attempt+' '+e);if(attempt===4)throw e;await slp(3000*attempt)}
            }
          }
          const data=await getApi(),list=data.opportunities;
          console.log('API_SNAPSHOT '+JSON.stringify({count:data.count,total:data.total,updatedAt:data.updatedAt,sourceFailures:data.sourceFailures,firstId:list[0].id,lastId:list[99].id}));
          const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage']});
          const ctx=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1,serviceWorkers:'block'});
          const main=await ctx.newPage();
          let ui={},jsErrors=[];
          main.on('pageerror',e=>jsErrors.push(String(e).slice(0,250)));
          try{
            const r=await main.goto(base+'/opportunities',{waitUntil:'domcontentloaded',timeout:45000});
            await main.screenshot({path:root+'/discovery-top.png',fullPage:false});
            await main.locator('#o-body tr').first().waitFor({timeout:65000});
            await slp(1200);
            const initial=await main.locator('#o-body tr').count();
            let clicks=0;
            while(await main.locator('#o-body tr').count()<100&&clicks<10){
              const old=await main.locator('#o-body tr').count();
              const more=main.locator('#o-more');
              if(!await more.isVisible().catch(()=>false))break;
              await more.click({timeout:10000});clicks++;
              await main.waitForFunction(n=>document.querySelectorAll('#o-body tr').length>n,old,{timeout:28000}).catch(()=>{});
            }
            const count=await main.locator('#o-body tr').count();
            const rows=await main.locator('#o-body tr').evaluateAll(els=>els.slice(0,100).map((tr,i)=>({position:i+1,text:tr.innerText.replace(/\s+/g,' ').slice(0,360),link:tr.querySelector('td:first-child a')?.href||null})));
            const diffs=[];
            for(let i=0;i<Math.min(100,rows.length);i++){
              if(rows[i].link!==list[i].dappUrl)diffs.push({position:i+1,expected:list[i].dappUrl,actual:rows[i].link});
              if(!rows[i].text.toLowerCase().includes(list[i].assetSymbol.toLowerCase()))diffs.push({position:i+1,symbol:list[i].assetSymbol,text:rows[i].text.slice(0,100)});
            }
            await main.locator('#o-body tr').first().scrollIntoViewIfNeeded();
            await main.screenshot({path:root+'/discovery-first.png'});
            await main.locator('#o-body tr').nth(Math.min(count,50)-1).scrollIntoViewIfNeeded();
            await main.screenshot({path:root+'/discovery-middle.png'});
            await main.locator('#o-body tr').nth(Math.min(count,100)-1).scrollIntoViewIfNeeded();
            await main.screenshot({path:root+'/discovery-last.png'});
            ui={status:r?.status(),title:await main.title(),initialRowCount:initial,loadedRowCount:count,loadMoreClicks:clicks,jsErrors,diffs,rows};
          }catch(e){ui={error:String(e),url:main.url(),body:(await main.locator('body').innerText().catch(()=>'' )).slice(0,1000),jsErrors}}
          await main.close();
          console.log('VISIBLE_PAGE '+JSON.stringify({status:ui.status,initial:ui.initialRowCount,rendered:ui.loadedRowCount,clicks:ui.loadMoreClicks,diffs:ui.diffs?.slice(0,15),error:ui.error,jsErrors:ui.jsErrors}));
          const findings=Array(100),screenshots=[];
          let cursor=0;
          const around=(s,re,max=8)=>{
            const matches=[];let m;re.lastIndex=0;
            while((m=re.exec(s))&&matches.length<max){
              const val=s.slice(Math.max(0,m.index-90),Math.min(s.length,m.index+110)).replace(/\s+/g,' ').trim();
              if(!matches.includes(val))matches.push(val);
            }
            return matches;
          };
          async function inspect(x,i,page){
            const evidence={position:i+1,protocol:x.protocol,marketName:x.marketName,assetSymbol:x.assetSymbol,assetAddress:x.asset,marketContract:x.address,marketId:x.marketId,apiRate:x.lendApr,apiRateType:x.rateType,aprEquivalent:x.rateType==='APR'?x.lendApr:100*Math.log1p(x.lendApr/100),apiTVL:x.tvlUsdEstimate,apiRateSource:x.rateSource,apiDappUrl:x.dappUrl,depositMode:x.depositMode,indexOnly:x.indexOnly,lpComposition:!!x.lpComposition,additionalAssets:x.additionalAssets||[]};
            const issues=[];
            if(evidence.aprEquivalent<=1||!Number.isFinite(evidence.aprEquivalent))issues.push('invalid-apr');
            if(x.directDepositCompatible!==true||x.depositMode!=='single-token'||x.lpComposition||x.additionalAssets?.length)issues.push('non-direct-single-asset');
            if(x.dappLinkType!=='detail'||!x.dappUrl)issues.push('no-exact-dapp');
            try{
              const r=await page.goto(x.dappUrl,{waitUntil:'domcontentloaded',timeout:25000});
              await slp(1700);
              const t=await page.locator('body').innerText({timeout:9000}).catch(()=>'');
              const text=t.replace(/\s+/g,' ');
              const buttonData=await page.locator('button,[role="button"],a,input[type="submit"]').evaluateAll(els=>els.filter(el=>{const s=getComputedStyle(el);const b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0}).map(el=>({label:(el.innerText||el.getAttribute('aria-label')||el.value||'').replace(/\s+/g,' ').trim().slice(0,70),disabled:!!el.disabled,href:el.href||null})).filter(x=>x.label).slice(0,100)).catch(()=>[]);
              const depositButtons=buttonData.filter(b=>/\b(deposit|supply|stake|invest|add liquidity|add funds)\b/i.test(b.label));
              const walletButtons=buttonData.filter(b=>/connect wallet|connect(?!ion)|log in/i.test(b.label));
              const analytics=around(t,/\b(?:TVL|Total Market Size|Supplied|Supply APY|Spot APY|Net APY|APY|APR|Yield|Interest)\b/gi,9);
              const rates=around(t,/(?:\d+(?:\.\d+)?%\s*(?:APR|APY|Supply)|(?:APR|APY|Supply APY|Spot APY|Net APY)\s*[:\s]*\d+(?:\.\d+)?%)/gi,12);
              const finalUrl=page.url();
              const symbolFound=!!x.assetSymbol&&text.toLowerCase().includes(x.assetSymbol.toLowerCase());
              const idFound=!!x.marketId&&finalUrl.toLowerCase().includes(x.marketId.toLowerCase());
              const addrFound=!!x.address&&finalUrl.toLowerCase().includes(x.address.toLowerCase());
              const badPage=/page not found|404 not found|page doesn't exist|vault not found|application error|access denied|error 403|checking your browser|just a moment/i.test(text.slice(0,1000))&&text.length<2800;
              if(!r||r.status()>=400)issues.push('HTTP_'+String(r?.status()??'NO_RESPONSE'));
              if(badPage)issues.push('rendered_error_page');
              if(!symbolFound)issues.push('listed_asset_not_visible');
              if(!idFound&&!addrFound&&!x.protocol.startsWith('Aave')&&!x.protocol.startsWith('CurveLend'))issues.push('market_identifier_not_in_dapp_route');
              if(!depositButtons.length)issues.push('no_visible_deposit_or_supply_action');
              if(!walletButtons.length&&!depositButtons.length)issues.push('no_accessible_wallet_or_deposit_ui');
              if(!analytics.length)issues.push('no_visible_market_analytics');
              Object.assign(evidence,{status:r?.status(),finalUrl,pageTitle:await page.title().catch(()=>''),visibleTextLength:t.length,textStart:text.slice(0,750),assetVisible:symbolFound,identifierInUrl:idFound||addrFound,depositButtons:depositButtons.slice(0,12),walletButtons:walletButtons.slice(0,8),visibleControls:buttonData.slice(0,26),analytics,rates,badPage});
              if((i<5||issues.length||i%20===0)&&screenshots.length<24){
                const name='dapp-'+String(i+1).padStart(3,'0')+'.png';
                try{await page.screenshot({path:root+'/'+name,timeout:7000});evidence.screenshot=name;screenshots.push(name)}catch(e){}
              }
            }catch(e){issues.push('navigation_or_render_failed');evidence.navigationError=String(e)}
            evidence.issues=issues;
            console.log('DAPP_CHECK '+JSON.stringify({n:i+1,protocol:x.protocol,asset:x.assetSymbol,rate:x.lendApr,status:evidence.status,assetVisible:evidence.assetVisible,depositButtons:evidence.depositButtons?.map(z=>z.label),walletButtons:evidence.walletButtons?.map(z=>z.label),analytics:evidence.analytics?.length||0,issues,rateClues:evidence.rates?.slice(0,2),error:evidence.navigationError}));
            return evidence;
          }
          await Promise.all(Array.from({length:5},async()=>{
            const p=await ctx.newPage();
            while(cursor<100){
              const i=cursor++;
              try{findings[i]=await inspect(list[i],i,p)}catch(e){findings[i]={position:i+1,error:String(e),issues:['audit_exception']};console.log('AUDIT_EXCEPTION '+(i+1)+' '+e)}
              await p.goto('about:blank').catch(()=>{});
            }
            await p.close();
          }));
          await ctx.close();await browser.close();
          const failed=findings.filter(x=>x.issues?.length);
          const report={recordedAt:new Date().toISOString(),api:{count:data.count,updatedAt:data.updatedAt,partial:data.partial,sourceFailures:data.sourceFailures,discoveryFilter:data.discoveryFilter},ui,findings};
          fs.writeFileSync(root+'/first100-dapp-audit-v1.json',JSON.stringify(report,null,2));
          const problemCounts={};for(const f of failed)for(const x of f.issues)problemCounts[x]=(problemCounts[x]||0)+1;
          console.log('FINAL_AUDIT '+JSON.stringify({audited:findings.length,flagged:failed.length,unflagged:findings.length-failed.length,problems:problemCounts,pageUIError:ui.error||null,pageRows:ui.loadedRowCount,pageMismatch:ui.diffs?.length,screenshots:screenshots.length}));
          NODE
          cd "$RUNNER_TEMP/market-review"
          node audit.mjs
      - name: Archive requested audit results and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curveYield-first100-visual-audit-v1
          path: _audit_results/
          if-no-files-found: warn
          retention-days: 7
      - name: Clean temporary workflow from repository
        if: always()
        run: |
          rm -f .github/workflows/curveyield-first100-visual-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/curveyield-first100-visual-audit.yml
          git commit -m "Remove one-time first 100 audit trigger" || true
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
