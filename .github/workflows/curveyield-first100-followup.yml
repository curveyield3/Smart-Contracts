name: One-time follow-up for first 100 ambiguous dapps
on:
  push:
    paths: [".github/workflows/curveyield-first100-followup.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/followup"
          cd "$RUNNER_TEMP/followup"
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Reinspect ambiguous browser results with ten-second hydration
        run: |
          cat > "$RUNNER_TEMP/followup/check.mjs" <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const root=process.env.GITHUB_WORKSPACE+'/_followup_results';
          fs.mkdirSync(root,{recursive:true});
          const u='https://markets.curveyield.org/api/opportunities?sort=tvl&limit=100&offset=0';
          const res=await fetch(u,{signal:AbortSignal.timeout(110000)});
          if(!res.ok)throw Error('API HTTP '+res.status);
          const d=await res.json();
          if(!d.discoveryFilter?.singleAsset||d.opportunities?.length!==100)throw Error('Invalid filtered catalog');
          const all=d.opportunities;
          const targets=all.map((x,i)=>({...x,position:i+1})).filter(x=>['Aave V3','Aave V4','Yearn V3','CurveLend V2','IPOR Fusion'].includes(x.protocol)||x.address==='0xe4db1c5a1b709ce4d2ada6985d9d506e58f73829');
          console.log('FOLLOWUP_TARGETS '+JSON.stringify(targets.map(x=>({n:x.position,p:x.protocol,name:x.marketName,asset:x.assetSymbol,url:x.dappUrl}))));
          const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage']});
          const ctx=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1,serviceWorkers:'block'});
          let cursor=0;const result=Array(targets.length);
          await Promise.all(Array.from({length:5},async()=>{
            const page=await ctx.newPage();
            while(cursor<targets.length){
              const i=cursor++,x=targets[i];
              const item={position:x.position,protocol:x.protocol,market:x.marketName,asset:x.assetSymbol,apiRate:x.lendApr,apiTVL:x.tvlUsdEstimate,contract:x.address,url:x.dappUrl};
              try{
                const response=await page.goto(x.dappUrl,{waitUntil:'domcontentloaded',timeout:32000});
                await page.waitForTimeout(10500);
                let body=await page.locator('body').innerText({timeout:10000}).catch(()=>'');
                if(/this page couldn.t load/i.test(body)){
                  await page.reload({waitUntil:'domcontentloaded',timeout:25000}).catch(()=>{});
                  await page.waitForTimeout(4500);
                  body=await page.locator('body').innerText({timeout:10000}).catch(()=>'');
                }
                const controls=await page.locator('button,a,[role="button"],input[type="submit"]').evaluateAll(els=>els.filter(el=>{const s=getComputedStyle(el),box=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&box.width>0&&box.height>0}).map(el=>({label:(el.innerText||el.getAttribute('aria-label')||el.value||'').trim().replace(/\s+/g,' ').slice(0,65),disabled:!!el.disabled,href:el.href||null})).filter(z=>z.label).slice(0,95)).catch(()=>[]);
                const buttons=controls.filter(b=>/\b(deposit|supply|stake|connect|invest|get started|enter amount)\b/i.test(b.label));
                const regex=/(\b(?:APY|APR|yield|interest|deposits|liquidity|size|total market size|net APY|supply APY|lend rate)\b.{0,65}?\d+(?:\.\d+)?%|\b\d+(?:\.\d+)?%\b.{0,75}\b(?:APR|APY|yield))/gi;
                const clues=[];let m;
                while((m=regex.exec(body))&&clues.length<10)clues.push(m[0].replace(/\s+/g,' '));
                Object.assign(item,{httpStatus:response?.status(),finalUrl:page.url(),pageTitle:await page.title(),assetVisible:body.toLowerCase().includes(x.assetSymbol.toLowerCase()),visibleChars:body.length,visibleText:body.slice(0,2300).replace(/\s+/g,' '),controls:buttons.slice(0,22),clues,notFound:/404|not found|vault not supported|page couldn.t load|page could not be found|application error/i.test(body.slice(0,1400))});
                try{const img='secondpass-'+String(x.position).padStart(3,'0')+'.png';await page.screenshot({path:root+'/'+img,timeout:12000});item.screenshot=img}catch(e){}
              }catch(e){item.error=String(e)}
              result[i]=item;
              console.log('FOLLOWUP_RESULT '+JSON.stringify({n:item.position,protocol:item.protocol,asset:item.asset,HTTP:item.httpStatus,visible:item.assetVisible,title:item.pageTitle,notFound:item.notFound,clues:item.clues,controls:item.controls?.map(b=>b.label),error:item.error,text:item.visibleText?.slice(0,180)}));
              await page.goto('about:blank').catch(()=>{});
            }
            await page.close();
          }));
          await ctx.close();await browser.close();
          fs.writeFileSync(root+'/first100-followup-v1.json',JSON.stringify({updatedAt:d.updatedAt,records:result},null,2));
          console.log('FOLLOWUP_DONE '+JSON.stringify({records:result.length,http404:result.filter(x=>x.httpStatus===404).map(x=>x.position),errorPages:result.filter(x=>x.notFound).map(x=>x.position),assetMissing:result.filter(x=>x.assetVisible===false).map(x=>x.position)}));
          NODE
          cd "$RUNNER_TEMP/followup"
          node check.mjs
      - name: Save verified screenshots and follow-up report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curveYield-first100-followup-v1
          path: _followup_results/
          if-no-files-found: warn
          retention-days: 7
      - name: Delete one-time follow-up trigger
        if: always()
        run: |
          rm -f .github/workflows/curveyield-first100-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/curveyield-first100-followup.yml
          git commit -m "Remove one-time first100 follow-up trigger" || true
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
