name: cyWBTC Ethereum IPOR source compile v2
on:
  push:
    paths:
      - 'cyWBTC-Ethereum/contracts/**'
      - 'cyWBTC-Ethereum/test/**'
      - '.github/workflows/cywbtc-ethereum-compile-v2.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile v19-derived Ethereum contracts without via-ir
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cywbtc-ethereum"
          mkdir -p "$ROOT"
          git fetch --no-tags --depth=1 origin 65d1023b9576a49e6de32d0b9f245d06e9c55a3b
          git show 65d1023b9576a49e6de32d0b9f245d06e9c55a3b:cywbtc-ipor-source-v19/cyWBTC_IPOR_Source_v19_V7_Compiler_Repair.zip > "$RUNNER_TEMP/cywbtc-source-v19.zip"
          printf '%s  %s\n' 41a55c5f5d33d0135d0b2ebde0ad8fc558b014060c9d99b15f2bf2bc46b79947 "$RUNNER_TEMP/cywbtc-source-v19.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cywbtc-source-v19.zip" -d "$ROOT"
          mkdir -p "$ROOT/contracts/fuses/fxsp" "$ROOT/contracts/fuses/convex" "$ROOT/contracts/executors" "$ROOT/test/fork" "$ROOT/simulation-output"
          cp cyWBTC-Ethereum/test/fork/CyWBTCSafetyFork_v1.t.sol "$ROOT/test/fork/"
          cp -r cyWBTC-Ethereum/contracts/* "$ROOT/contracts/"
          cd "$ROOT"
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.30"
          auto_detect_solc = false
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 10000
          fs_permissions = [{ access = "read-write", path = "./simulation-output" }]
          via_ir = false
          remappings = [
            "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
            "forge-std/=lib/forge-std/src/",
            "@tokenized-strategy/=lib/tokenized-strategy/",
            "@yearn-vaults/=lib/yearn-vaults/"
          ]
          TOML
          forge build --sizes \
            contracts/fuses/fxsp/FxSPSupplyFuse.sol \
            contracts/fuses/fxsp/FxSPCurveBalanceFuse.sol \
            contracts/fuses/convex/ConvexFXGaugeSupplyFuse.sol \
            contracts/fuses/convex/ConvexFXGaugeBalanceFuse.sol \
            contracts/fuses/fxmint/FXMintBalanceFuse.sol \
            contracts/fuses/fxmint/FXMintLTVManager.sol \
            contracts/fuses/fxmint/FXMintBorrowFuse.sol \
            contracts/fuses/fxmint/FXMintCollateralFuse.sol \
            contracts/price_oracle/price_feed/FXNPriceFeedEthereum_v1.sol

      - name: Execute cyWBTC admin/user integrity checks on an isolated mainnet fork
        shell: bash
        env:
          MAINNET_FORK_URL: ${{ secrets.ETHEREUM_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cywbtc-ethereum"
          RPC="${MAINNET_FORK_URL:-https://ethereum-rpc.publicnode.com}"
          cd "$ROOT"
          mkdir -p simulation-output
          # The pinned v19 archive contains retired Yearn contracts unrelated to cyWBTC.
          # Their legacy compiler error must not shadow this isolated IPOR fork suite.
          rm -rf contracts/yearn
          set +e
          forge test --isolate --fork-url "$RPC" --fork-block-number 26502615 --match-path test/fork/CyWBTCSafetyFork_v1.t.sol -vvv > fork-test.log 2>&1
          EXIT_CODE=$?
          set -e
          cat fork-test.log
          printf '{"forkTestExitCode":%s,"mainnetWrites":false,"status":"%s"}\n' "$EXIT_CODE" "$([ "$EXIT_CODE" = 0 ] && echo PASS || echo FAIL)" > simulation-output/fork-status-v1.json
          exit "$EXIT_CODE"

      - name: Compile and validate compact viaIR 200-run profile
        shell: bash
        env:
          MAINNET_FORK_URL: ${{ secrets.ETHEREUM_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cywbtc-ethereum"
          RPC="${MAINNET_FORK_URL:-https://ethereum-rpc.publicnode.com}"
          export FOUNDRY_VIA_IR=true FOUNDRY_OPTIMIZER_RUNS=200 FOUNDRY_OUT=out-ir200 FOUNDRY_CACHE_PATH=cache-ir200
          forge build --sizes \
            contracts/fuses/fxsp/FxSPSupplyFuse.sol \
            contracts/fuses/fxsp/FxSPCurveBalanceFuse.sol \
            contracts/fuses/convex/ConvexFXGaugeSupplyFuse.sol \
            contracts/fuses/convex/ConvexFXGaugeBalanceFuse.sol \
            contracts/fuses/fxmint/FXMintBalanceFuse.sol \
            contracts/fuses/fxmint/FXMintLTVManager.sol \
            contracts/fuses/fxmint/FXMintBorrowFuse.sol \
            contracts/fuses/fxmint/FXMintCollateralFuse.sol \
            contracts/price_oracle/price_feed/FXNPriceFeedEthereum_v1.sol | tee compact-build.log
          mv simulation-output simulation-output-default
          mkdir simulation-output
          set +e
          forge test --isolate --fork-url "$RPC" --fork-block-number 26502615 --match-path test/fork/CyWBTCSafetyFork_v1.t.sol -vv > compact-fork-test.log 2>&1
          EXIT_CODE=$?
          set -e
          cat compact-fork-test.log
          mv simulation-output simulation-output-default/compact-profile
          mv simulation-output-default simulation-output
          cp compact-build.log compact-fork-test.log simulation-output/
          exit "$EXIT_CODE"

      - name: Diagnose prior slippage failure against the accepted pre-refactor revision
        if: always()
        shell: bash
        env:
          MAINNET_FORK_URL: ${{ secrets.ETHEREUM_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cywbtc-ethereum"
          RPC="${MAINNET_FORK_URL:-https://ethereum-rpc.publicnode.com}"
          REFERENCE=4d4df1e04c0f1ff571cc4ec4071f07f982730539
          CONTROL="$RUNNER_TEMP/cywbtc-slippage-control"
          mkdir -p "$CONTROL"
          cp -a "$ROOT/." "$CONTROL/"
          git fetch --no-tags --depth=1 origin "$REFERENCE"
          for path in contracts/fuses/fxmint/FXMintLTVManager.sol contracts/fuses/convex/ConvexFXGaugeSupplyFuse.sol contracts/executors/FulfillWithdrawExecutor.sol test/fork/CyWBTCSafetyFork_v1.t.sol; do
            mkdir -p "$CONTROL/$(dirname "$path")"
            git show "$REFERENCE:cyWBTC-Ethereum/$path" > "$CONTROL/$path"
          done
          cd "$CONTROL"
          rm -rf contracts/yearn
          mkdir -p simulation-output "$ROOT/simulation-output"
          set +e
          FOUNDRY_OUT=out-control FOUNDRY_CACHE_PATH=cache-control forge test --isolate --fork-url "$RPC" --fork-block-number 26502798 --match-path test/fork/CyWBTCSafetyFork_v1.t.sol --match-test '^test_18_admin_rebalance_down_at_crash_price_then_full_user_exit        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cywbtc-ethereum-fork-security-v1
          path: |
            ${{ runner.temp }}/cywbtc-ethereum/simulation-output/**
            ${{ runner.temp }}/cywbtc-ethereum/fork-test.log
          if-no-files-found: warn
          retention-days: 90
 -vvv > "$ROOT/simulation-output/prior-source-slippage-control.log" 2>&1
          CONTROL_EXIT=$?
          set -e
          echo "PRIOR_SOURCE_AT_26502798_EXIT=$CONTROL_EXIT"
          grep -E 'Suite result:|\[FAIL|UniversalTokenSwapperFuseSlippageFail|CallOutcomeMismatch' "$ROOT/simulation-output/prior-source-slippage-control.log" | tail -n 15 || true

      - name: Retain transactional snapshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cywbtc-ethereum-fork-security-v1
          path: |
            ${{ runner.temp }}/cywbtc-ethereum/simulation-output/**
            ${{ runner.temp }}/cywbtc-ethereum/fork-test.log
          if-no-files-found: warn
          retention-days: 90
