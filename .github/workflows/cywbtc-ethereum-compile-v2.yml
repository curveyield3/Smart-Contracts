name: cyWBTC Ethereum IPOR source compile v2
on:
  push:
    paths:
      - 'cyWBTC-Ethereum/contracts/**'
      - 'cyWBTC-Ethereum/test/**'
      - '.github/workflows/cywbtc-ethereum-compile-v2.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile v19-derived Ethereum contracts without via-ir
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cywbtc-ethereum"
          mkdir -p "$ROOT"
          git fetch --no-tags --depth=1 origin 65d1023b9576a49e6de32d0b9f245d06e9c55a3b
          git show 65d1023b9576a49e6de32d0b9f245d06e9c55a3b:cywbtc-ipor-source-v19/cyWBTC_IPOR_Source_v19_V7_Compiler_Repair.zip > "$RUNNER_TEMP/cywbtc-source-v19.zip"
          printf '%s  %s\n' 41a55c5f5d33d0135d0b2ebde0ad8fc558b014060c9d99b15f2bf2bc46b79947 "$RUNNER_TEMP/cywbtc-source-v19.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cywbtc-source-v19.zip" -d "$ROOT"
          mkdir -p "$ROOT/contracts/fuses/fxsp" "$ROOT/contracts/fuses/convex" "$ROOT/contracts/executors" "$ROOT/test/fork" "$ROOT/simulation-output"
          cp cyWBTC-Ethereum/test/fork/CyWBTCSafetyFork_v1.t.sol "$ROOT/test/fork/"
          cp -r cyWBTC-Ethereum/contracts/* "$ROOT/contracts/"
          cd "$ROOT"
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "contracts"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.30"
          auto_detect_solc = false
          evm_version = "cancun"
          optimizer = true
          optimizer_runs = 10000
          fs_permissions = [{ access = "read-write", path = "./simulation-output" }]
          via_ir = false
          remappings = [
            "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
            "forge-std/=lib/forge-std/src/",
            "@tokenized-strategy/=lib/tokenized-strategy/",
            "@yearn-vaults/=lib/yearn-vaults/"
          ]
          TOML
          forge build --sizes \
            contracts/fuses/fxsp/FxSPSupplyFuse.sol \
            contracts/fuses/fxsp/FxSPCurveBalanceFuse.sol \
            contracts/fuses/convex/ConvexFXGaugeSupplyFuse.sol \
            contracts/fuses/convex/ConvexFXGaugeBalanceFuse.sol \
            contracts/fuses/fxmint/FXMintBalanceFuse.sol \
            contracts/fuses/fxmint/FXMintLTVManager.sol \
            contracts/fuses/fxmint/FXMintBorrowFuse.sol \
            contracts/fuses/fxmint/FXMintCollateralFuse.sol \
            contracts/executors/FulfillWithdrawExecutor.sol \
            contracts/price_oracle/price_feed/FXNPriceFeedEthereum_v1.sol

      - name: Execute cyWBTC admin/user integrity checks on an isolated mainnet fork
        shell: bash
        env:
          MAINNET_FORK_URL: ${{ secrets.ETHEREUM_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cywbtc-ethereum"
          RPC="${MAINNET_FORK_URL:-https://ethereum-rpc.publicnode.com}"
          cd "$ROOT"
          mkdir -p simulation-output
          # The pinned v19 archive contains retired Yearn contracts unrelated to cyWBTC.
          # Their legacy compiler error must not shadow this isolated IPOR fork suite.
          rm -rf contracts/yearn
          set +e
          forge test --isolate --fork-url "$RPC" --match-path test/fork/CyWBTCSafetyFork_v1.t.sol -vvv > fork-test.log 2>&1
          EXIT_CODE=$?
          set -e
          cat fork-test.log
          printf '{"forkTestExitCode":%s,"mainnetWrites":false,"status":"%s"}\n' "$EXIT_CODE" "$([ "$EXIT_CODE" = 0 ] && echo PASS || echo FAIL)" > simulation-output/fork-status-v1.json
          exit "$EXIT_CODE"

      - name: Compare fixed-block existing fork calls and validate smallest compiler profile
        shell: bash
        env:
          MAINNET_FORK_URL: ${{ secrets.ETHEREUM_FORK_RPC_URL }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cywbtc-ethereum"
          BENCH="$RUNNER_TEMP/cywbtc-optimizer-benchmark"
          MANAGER="contracts/fuses/fxmint/FXMintLTVManager.sol"
          RPC="${MAINNET_FORK_URL:-https://ethereum-rpc.publicnode.com}"
          mkdir -p "$BENCH/results"
          git fetch --no-tags --depth=1 origin 826debc23798185b8e156cd8b3ebc3f47e6319c0
          git show "826debc23798185b8e156cd8b3ebc3f47e6319c0:cyWBTC-Ethereum/$MANAGER" > "$BENCH/baseline.sol"
          cd "$ROOT"
          cp "$MANAGER" "$BENCH/candidate.sol"
          mv simulation-output "$BENCH/default-snapshots"
          restore() {
            cp "$BENCH/candidate.sol" "$MANAGER"
            if [ -d simulation-output ]; then mv simulation-output "$BENCH/results/interrupted-snapshots"; fi
            mv "$BENCH/default-snapshots" simulation-output
            mv "$BENCH/results" simulation-output/optimizer-benchmark
          }
          trap restore EXIT
          BLOCK="$(cast block-number --rpc-url "$RPC")"
          printf '%s\n' "$BLOCK" > "$BENCH/results/fork-block.txt"
          echo "BENCHMARK_FORK_BLOCK $BLOCK"
          TESTS=(test_06_instant_withdraw_after_wbtc_appreciation_keeps_debt_exact test_14_partial_scheduled_withdrawal_then_remaining_full_exit test_18_admin_rebalance_down_at_crash_price_then_full_user_exit)
          for profile in baseline candidate candidate-ir200 candidate-ir1000; do
            case "$profile" in
              baseline) cp "$BENCH/baseline.sol" "$MANAGER"; runs=10000; ir=false ;;
              candidate) cp "$BENCH/candidate.sol" "$MANAGER"; runs=10000; ir=false ;;
              candidate-ir200) cp "$BENCH/candidate.sol" "$MANAGER"; runs=200; ir=true ;;
              candidate-ir1000) cp "$BENCH/candidate.sol" "$MANAGER"; runs=1000; ir=true ;;
            esac
            mkdir -p "$BENCH/results/$profile"
            for test in "${TESTS[@]}"; do
              mkdir -p simulation-output
              if FOUNDRY_OUT="out-bench-$profile" FOUNDRY_CACHE_PATH="cache-bench-$profile" FOUNDRY_VIA_IR="$ir" FOUNDRY_OPTIMIZER_RUNS="$runs" \
                forge test --isolate --fork-url "$RPC" --fork-block-number "$BLOCK" --match-path test/fork/CyWBTCSafetyFork_v1.t.sol --match-test "^$test$" -vv > "$BENCH/results/$profile/$test.log" 2>&1; then
                echo "BENCH $profile $test PASS"
              else
                echo "BENCH $profile $test FAIL"
                tail -n 70 "$BENCH/results/$profile/$test.log"
              fi
              mv simulation-output "$BENCH/results/$profile/$test"
            done
          done
          mkdir -p simulation-output
          if FOUNDRY_OUT=out-bench-candidate-ir200 FOUNDRY_CACHE_PATH=cache-bench-candidate-ir200 FOUNDRY_VIA_IR=true FOUNDRY_OPTIMIZER_RUNS=200 \
            forge test --isolate --fork-url "$RPC" --fork-block-number "$BLOCK" --match-path test/fork/CyWBTCSafetyFork_v1.t.sol -vv > "$BENCH/results/candidate-ir200-full-suite.log" 2>&1; then
            echo "IR200_FULL_SUITE PASS"
            grep -E 'Suite result:|Ran [0-9]+ tests' "$BENCH/results/candidate-ir200-full-suite.log" || true
          else
            echo "IR200_FULL_SUITE FAIL"
            tail -n 100 "$BENCH/results/candidate-ir200-full-suite.log"
          fi
          mv simulation-output "$BENCH/results/candidate-ir200-full-suite"
          python3 - "$BENCH/results" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          fields = ('label','from','to','calldata','rawReturnOrRevertData','success','expectedSuccess','blockNumber','accountingUnchanged')
          def read(path):
              return json.loads(path.read_text())
          def same_call(a,b):
              return all(a.get(k) == b.get(k) for k in fields)
          def same_state(a,b,label):
              for suffix in ('before','after'):
                  p = a / f'state_{label}_{suffix}.json'
                  q = b / f'state_{label}_{suffix}.json'
                  if not p.exists() or not q.exists() or read(p) != read(q):
                      return False
              return True
          results = []
          for scenario in sorted((root/'baseline').glob('test_*')):
              if not scenario.is_dir():
                  continue
              for file in sorted(scenario.glob('transaction_*.json')):
                  original = read(file)
                  label = original.get('label','')
                  row = {'scenario':scenario.name,'label':label,'baseline':original.get('gasMeasuredInsideForge')}
                  for profile in ('candidate','candidate-ir200','candidate-ir1000'):
                      directory = root/profile/scenario.name
                      target = directory/file.name
                      if target.exists():
                          candidate = read(target)
                          if same_call(original,candidate) and same_state(scenario,directory,label):
                              row[profile] = candidate.get('gasMeasuredInsideForge')
                  if 'candidate' in row:
                      results.append(row)
                      if ('public_' in label or 'deleverages' in label or 'instant_release' in label or 'rebalance' in label or 'leverage' in label):
                          print('GAS_MATCH '+json.dumps(row,sort_keys=True))
          (root/'comparable-call-gas.json').write_text(json.dumps(results,indent=2))
          print('COMPARABLE_BASELINE_CANDIDATE_CALLS',len(results))
          PY

      - name: Retain transactional snapshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cywbtc-ethereum-fork-security-v1
          path: |
            ${{ runner.temp }}/cywbtc-ethereum/simulation-output/**
            ${{ runner.temp }}/cywbtc-ethereum/fork-test.log
          if-no-files-found: warn
          retention-days: 90
