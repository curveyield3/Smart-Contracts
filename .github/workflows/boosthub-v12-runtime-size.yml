name: BoostHub Staking Vyper compile-only size audit
on:
  push:
    branches: [boosthub-staking-compile-v17]
    paths:
      - 'boosthub-v12/BoostHubStaking.vy'
      - 'boosthub-v12/BoostHubStaking_v11_baseline.vy'
      - '.github/workflows/boosthub-v12-runtime-size.yml'
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Vyper compiler
        run: python -m pip install --disable-pip-version-check vyper==0.4.3
      - name: Compile v11 baseline and current staking source; report EIP-170 size
        shell: bash
        run: |
          set -euo pipefail
          vyper --version
          for label in v11 current; do
            if [ "$label" = v11 ]; then
              source_path="boosthub-v12/BoostHubStaking_v11_baseline.vy"
            else
              source_path="boosthub-v12/BoostHubStaking.vy"
            fi
            vyper -f bytecode_runtime "$source_path" > "$label.runtime.hex"
            vyper -f bytecode "$source_path" > "$label.creation.hex"
            LABEL="$label" SOURCE="$source_path" python - <<'PY'
          import json,os
          from pathlib import Path
          label=os.environ["LABEL"]
          runtime=Path(label+".runtime.hex").read_text().strip()
          creation=Path(label+".creation.hex").read_text().strip()
          assert runtime.startswith("0x") and creation.startswith("0x")
          runtime_bytes=(len(runtime)-2)//2
          creation_bytes=(len(creation)-2)//2
          data={"version":label,"source":os.environ["SOURCE"],"compiler":"vyper 0.4.3","runtime_bytes":runtime_bytes,"creation_bytes":creation_bytes,"eip170_limit":24576,"headroom":24576-runtime_bytes,"within_limit":runtime_bytes<=24576}
          Path(label+".size.json").write_text(json.dumps(data,indent=2)+"\n")
          print("BOOSTHUB_STAKING_RESULT="+json.dumps(data))
          PY
          done
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path("v11.size.json").read_text())
          new=json.loads(Path("current.size.json").read_text())
          print("STAKING_RUNTIME_DELTA_V17_MINUS_V11="+str(new["runtime_bytes"]-old["runtime_bytes"]))
          if new["runtime_bytes"]>24576:
              raise SystemExit("CURRENT_STAKING_EXCEEDS_EIP170")
          PY
      - name: Upload compile sizes and bytecode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-staking-v17-compile
          path: |
            *.size.json
            *.runtime.hex
            *.creation.hex
          if-no-files-found: ignore
