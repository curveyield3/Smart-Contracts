name: BoostHub v13 Solidity runtime-size build
on:
  push:
    branches: [boosthub-compile-v13]
    paths:
      - 'boosthub-v12/compilation-sources-v12.tar.xz.b64'
      - '.github/workflows/boosthub-v12-runtime-size.yml'
  pull_request:
    branches: [main]
    paths:
      - 'boosthub-v12/compilation-sources-v12.tar.xz.b64'
      - '.github/workflows/boosthub-v12-runtime-size.yml'
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore exact v12 compile sources
        shell: bash
        run: |
          mkdir -p boosthub-v12/workspace
          base64 --decode boosthub-v12/compilation-sources-v12.tar.xz.b64 > boosthub-v12/sources.tar.xz
          echo '26b4904672b6523ecf05aa06147e488816550c5e1be873ae5a513e77fcf128e1  boosthub-v12/sources.tar.xz' | sha256sum --check
          tar -xJf boosthub-v12/sources.tar.xz -C boosthub-v12/workspace
      - name: Apply exact v13 Hub source patch to v12 source bundle
        shell: bash
        run: |
          cat <<'BOOSTHUB_V13_PATCH' | base64 --decode | gzip -d | patch -p1 -d boosthub-v12/workspace
          
          BOOSTHUB_V13_PATCH
          echo '9b5769e2d6493a980427756c61ee6dc6fc68329578c99fb0104f0ad815014f41  boosthub-v12/workspace/contracts/BoostHub.sol' | sha256sum --check
      - name: Compile v13 without running tests
        working-directory: boosthub-v12/workspace
        shell: bash
        run: |
          set -o pipefail
          forge build --force --skip verification_v6 --skip historical_evidence_v3 --skip script --skip beefy 2>&1 | tee ../../boosthub-v12/compile-log-v12.txt
      - name: Report deployed runtime bytes against EIP-170
        working-directory: boosthub-v12/workspace
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path('build_v6/forge/BoostHub.sol/BoostHub.json').read_text())
          code = artifact['deployedBytecode']['object']
          if not code or len(code) % 2: raise SystemExit('invalid deployed bytecode')
          size = len(code.removeprefix('0x')) // 2
          result = {'contract':'BoostHub','version':'v13','solc':'0.8.28','optimizer_runs':200,'via_ir':True,'runtime_bytes':size,'eip170_limit_bytes':24576,'headroom_bytes':24576-size,'within_eip170':size<=24576}
          Path('boosthub-v13-runtime-size.json').write_text(json.dumps(result, indent=2) + '\n')
          print('BOOSTHUB_V13_RUNTIME_SIZE=' + str(size))
          print('BOOSTHUB_V13_EIP170_COMPLIANT=' + str(size <= 24576))
          PY
      - name: Upload runtime-size report
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v13-runtime-size
          path: boosthub-v12/workspace/boosthub-v12-runtime-size.json
          if-no-files-found: error
