name: Temporary ETH-WETH Morpho vault metric inspection
on:
  push:
    branches:
      - eth-market-research-20261117
    paths:
      - .github/workflows/eth_weth_catalog_inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect official Morpho vault-specific USD deposits and net APY
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,re,html
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor,as_completed
          class Visible(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.hide=0;self.p=[]
            def handle_starttag(self,tag,attrs):
              if tag in ('script','style','svg','noscript'):self.hide+=1
            def handle_endtag(self,tag):
              if tag in ('script','style','svg','noscript'):self.hide=max(0,self.hide-1)
            def handle_data(self,data):
              if not self.hide and data.strip():self.p.append(data.strip())
          asset='0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2'
          q=urllib.parse.urlencode(dict(asset=asset,conversion=0,limit=500,sort='tvl'))
          req=urllib.request.Request('https://markets.curveyield.org/api/opportunities?'+q,headers={'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as f: data=json.load(f)
          rows=[x for x in data.get('opportunities',[]) if x.get('protocol','').startswith('Morpho Vault') and x.get('dappUrl','').startswith('https://app.morpho.org/ethereum/vault/')]
          print('MORPHO_VAULT_COUNT',len(rows),flush=True)
          def fetch(x):
            url=x['dappUrl'];out={'url':url,'name':x.get('marketName'),'marketTvl':x.get('tvlUsdEstimate')}
            try:
              req=urllib.request.Request(url,headers={'Accept':'text/html,application/xhtml+xml','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=22) as f:raw=f.read(2200000)
              p=Visible();p.feed(raw.decode('utf-8','replace'))
              t=' '.join(p.p)
              t=re.sub(r'\s+',' ',t)
              for label in ('Returns','Instant APY','7D APY','7 Day APY','30 Day APY','Net APY','Total Deposits','Vault Details','Asset Deposits','Fee','Deposit APY','Supply APY'):
                finds=[]
                for m in list(re.finditer(re.escape(label),t,re.I))[:3]:
                  finds.append(t[max(0,m.start()-45):m.end()+125])
                if finds:out[label]=finds
            except Exception as e:out['error']=str(e)[:180]
            return out
          with ThreadPoolExecutor(max_workers=4) as pool:
            fut=[pool.submit(fetch,x) for x in rows]
            for f in as_completed(fut):
              print('MORPHO_VAULT_DETAIL|'+json.dumps(f.result(),separators=(',',':'),ensure_ascii=False),flush=True)
          print('MORPHO_VAULT_DONE',len(rows),flush=True)
          PY
