name: BoostHub full-stack compile (no tests)
on:
  workflow_dispatch:
  push:
    branches: [boosthub-safe-deploy-v36]
    paths:
      - 'BoostHub_Contract_Stack_v35/**'
      - '.github/workflows/boosthub-v35-compile.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install both pinned OpenZeppelin lines under dependencies/ only
        run: npm install --prefix BoostHub_Contract_Stack_v35/dependencies --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Install Vyper 0.4.3
        run: python -m pip install --disable-pip-version-check vyper==0.4.3
      - name: Generate source-bound Vyper staking bytecode
        run: cd BoostHub_Contract_Stack_v35 && python tooling/make_staking_artifact.py
      - name: Compile the complete Solidity source and the sole deployment script
        run: cd BoostHub_Contract_Stack_v35 && forge build --force
      - name: Upload compile outputs
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-full-stack-compile
          path: |
            BoostHub_Contract_Stack_v35/artifacts/staking.json
            BoostHub_Contract_Stack_v35/build/forge/
          if-no-files-found: error
      - name: Publish Vyper staking source to Blockscout (source-bound)
        if: contains(github.event.head_commit.message, '[verify-vyper]')
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, time, urllib.request, urllib.error
          source_bytes = pathlib.Path("BoostHub_Contract_Stack_v35/contracts/BoostHubStaking.vy").read_bytes()
          source = source_bytes.decode()
          artifact = json.loads(pathlib.Path("BoostHub_Contract_Stack_v35/artifacts/staking.json").read_text())
          assert artifact["sourceSha256"].lower() == "0x"+hashlib.sha256(source_bytes).hexdigest()
          assert artifact["compilerVersion"] == "0.4.3"
          assert "0.4.3" in subprocess.check_output(["vyper","--version"],text=True)
          SAFE = "0x47623C62f281807D615eeb4A2CEee9d97F9D3C49"
          HUB = "0x40f7085841034f752f17592875703eb5032f2b42"
          records = [
              ("0xe3a95f1cc42796cf3dc0c8140eaed89e5335ec37",
                "0xd1b5651e55d4ceed36251c61c50c889b36f6abb5",0,
                ["0xd533a949740bb3306d119cc777fa900ba034cd52","0xf939e0a03fb07f59a73314e73794be0e57ac1b4e","0x73968b9a57c6e53d41345fd57a6e6ae27d6cdb2f","0x6c3f90f043a72fa612cbac8115ee7e52bde6e49"]),
              ("0x55eb43c2112f7ed1127f7f313b17ff111f069217",
                "0xe19d1c837b8a1c83a56cd9165b2c0256d39653ad",1,
                ["0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0","0x73968b9a57c6e53d41345fd57a6e6ae27d6cdb2f"]),
          ]
          def request(url,data=None):
              headers={"Accept":"application/json","User-Agent":"CurveYield BoostHub staking verification"}
              if data is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=json.dumps(data).encode() if data is not None else None,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=35) as f:
                      raw=f.read(100000).decode()
                      return f.status,json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read(100000).decode()
                  try: reply=json.loads(raw)
                  except Exception: reply={"message":raw[:1500]}
                  return e.code,reply
          def read_status(addr):
              code,data=request("https://eth.blockscout.com/api/v2/addresses/"+addr)
              return code,data.get("is_contract"),data.get("is_verified"),data.get("name")
          def poll(addr,retries):
              for i in range(retries):
                  code,exists,verified,name=read_status(addr)
                  if verified is True: return True,name
                  if i+1<retries: time.sleep(6)
              return False,None
          passed=0
          for addr,want,pid,rewards in records:
              rewards=rewards+["0x0000000000000000000000000000000000000000"]*(8-len(rewards))
              words=[want,HUB,pid,SAFE,*rewards,SAFE,150]
              encoded="".join(format(int(x,16) if isinstance(x,str) else x,"064x") for x in words)
              assert len(encoded)==448*2, "Unexpected constructor ABI args"
              code,exists,verified,name=read_status(addr)
              assert code==200 and exists is True, "Blockscout does not index contract "+addr
              if verified is True:
                  print("BLOCKSCOUT_ALREADY_VERIFIED "+json.dumps({"address":addr,"name":name}),flush=True)
                  passed+=1
                  continue
              body={"compiler_version":"v0.4.3+commit.bff19ea2","license_type":"none",
                    "source_code":source,"contract_name":"BoostHubStaking",
                    "evm_version":"prague","constructor_args":encoded}
              url="https://eth.blockscout.com/api/v2/smart-contracts/"+addr+"/verification/via/vyper-code"
              status,response=request(url,body)
              print("BLOCKSCOUT_NATIVE_VYPER_SUBMISSION "+json.dumps({"address":addr,"http":status,"response":response}),flush=True)
              verified,name=poll(addr,10)
              if not verified:
                  # Sourcify has independently published exact-matching source; request native Blockscout import.
                  surl="https://eth.blockscout.com/api/v2/smart-contracts/"+addr+"/verification/via/sourcify"
                  scode,sresponse=request(surl,{})
                  print("BLOCKSCOUT_SOURCIFY_IMPORT "+json.dumps({"address":addr,"http":scode,"response":sresponse}),flush=True)
                  verified,name=poll(addr,10)
              print("BLOCKSCOUT_FINAL "+json.dumps({"address":addr,"verified":verified,"contractName":name}),flush=True)
              passed+=int(verified)
          if passed!=len(records): raise SystemExit("Blockscout verification incomplete: "+str(passed)+"/"+str(len(records)))
          print("BLOCKSCOUT_ALL_VERIFIED 2/2")
          PY
