name: BoostHub full-stack compile (no tests)
on:
  workflow_dispatch:
  push:
    branches: [boosthub-safe-deploy-v36]
    paths:
      - 'BoostHub_Contract_Stack_v35/**'
      - '.github/workflows/boosthub-v35-compile.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install both pinned OpenZeppelin lines under dependencies/ only
        run: npm install --prefix BoostHub_Contract_Stack_v35/dependencies --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Install Vyper 0.4.3
        run: python -m pip install --disable-pip-version-check vyper==0.4.3
      - name: Generate source-bound Vyper staking bytecode
        run: cd BoostHub_Contract_Stack_v35 && python tooling/make_staking_artifact.py
      - name: Compile the complete Solidity source and the sole deployment script
        run: cd BoostHub_Contract_Stack_v35 && forge build --force
      - name: Upload compile outputs
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-full-stack-compile
          path: |
            BoostHub_Contract_Stack_v35/artifacts/staking.json
            BoostHub_Contract_Stack_v35/build/forge/
          if-no-files-found: error
