name: Ethereum Fraxtal Omni Router runtime-size compile
on:
  workflow_dispatch:
  push:
    branches: [ethereum-fraxtal-omni-router-v2]
    paths:
      - '.github/workflows/katana-router-runtime-compile.yml'
      - 'routers/ethereum-fraxtal/CurveYieldOmniRouter.sol'
      - 'routers/ethereum-fraxtal/CurveYieldHistoricalPriceReader.sol'
permissions:
  contents: read
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Solidity 0.8.28 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/omni-router-build
          cd /tmp/omni-router-build
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            solc@0.8.28 @uniswap/v4-core@1.0.2
      - name: Compile attached exact router source (no tests, no deployment)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const solc = require('/tmp/omni-router-build/node_modules/solc');
          const base='routers/ethereum-fraxtal';
          const paths=[
            base+'/CurveYieldOmniRouter.sol',
            base+'/CurveYieldHistoricalPriceReader.sol'
          ];
          const sources={};
          for(const filename of paths) sources[filename]={content:fs.readFileSync(filename,'utf8')};
          const input={
            language:'Solidity',
            sources,
            settings:{
              optimizer:{enabled:true,runs:1},
              viaIR:true,
              outputSelection:{'*':{'*':['evm.deployedBytecode.object','evm.bytecode.object']}}
            }
          };
          function findImports(name){
            const inRepo=path.resolve(name);
            const inNpm=path.resolve('/tmp/omni-router-build/node_modules',name);
            const at=fs.existsSync(inRepo)?inRepo:inNpm;
            return fs.existsSync(at) ? {contents:fs.readFileSync(at,'utf8')} : {error:'Unresolved import '+name};
          }
          const result=JSON.parse(solc.compile(JSON.stringify(input),{import:findImports}));
          for(const e of result.errors||[]) console.log(e.formattedMessage||e.message);
          if((result.errors||[]).some(e=>e.severity==='error'))process.exit(1);
          const data=[];
          for(const filename of paths){
            for(const [name,artifact] of Object.entries(result.contracts?.[filename]||{})){
              const runtime=artifact.evm?.deployedBytecode?.object||'';
              const creation=artifact.evm?.bytecode?.object||'';
              if(!runtime && !creation) continue; // interfaces and abstract libraries
              if(!runtime || runtime.length%2 || !creation || creation.length%2)
                throw Error('Invalid deployed bytecode: '+filename+':'+name);
              const item={
                contract:name,source:filename,
                source_sha256_trimmed:crypto.createHash('sha256').update(sources[filename].content.trimEnd()).digest('hex'),
                solc:solc.version(),optimizer_runs:1,viaIR:true,
                runtime_bytes:runtime.length/2,creation_bytes:creation.length/2,
                eip170_limit:24576,headroom:24576-runtime.length/2,
                within_limit:runtime.length/2<=24576
              };
              data.push(item);console.log('OMNI_ROUTER_RUNTIME_COMPILE_RESULT='+JSON.stringify(item));
              if(!item.within_limit)process.exitCode=1;
            }
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'omni-router-runtime-size-v7.json'),JSON.stringify(data,null,2)+'\\n');
          NODE
      - name: Upload runtime-size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-router-runtime-size-v7
          path: ${{ runner.temp }}/omni-router-runtime-size-v7.json
          if-no-files-found: ignore
      - name: Assemble router-only source package v7
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/CurveYield_Omni_Router_v7"
          mkdir -p "$out"
          cp routers/ethereum-fraxtal/CurveYieldOmniRouter.sol "$out/"
          cp routers/ethereum-fraxtal/CurveYieldHistoricalPriceReader.sol "$out/"
          {
            printf '# CurveYield Omni Router source package v7\n\n'
            printf 'Ethereum + Fraxtal. Router-only package. V3 TWAP kept internally; external reader adds fee-aware route minimums; deployed reader address is immutable on router; consolidated pool execution plus future adapter support. Build results are supplied by the GitHub Actions compile job.\\n\\n'
            cat routers/ethereum-fraxtal/README_v3.md
          } > "$out/README.md"
          cat > "$out/package.json" <<'JSON'
          {
            "name": "curveyield-omni-router",
            "version": "7.0.0",
            "private": true,
            "description": "Ethereum/Fraxtal mixed-pool router Solidity sources",
            "dependencies": {
              "@uniswap/v4-core": "1.0.2"
            }
          }
          JSON
          find "$out" -maxdepth 1 -type f -printf '%f\\n' | sort
          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Upload clean router-only source package v7
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield_Omni_Router_v7
          path: ${{ runner.temp }}/CurveYield_Omni_Router_v7/
          if-no-files-found: error
          retention-days: 90
