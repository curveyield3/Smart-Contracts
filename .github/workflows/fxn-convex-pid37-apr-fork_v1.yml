name: Convex f(x) PID 37 one-fxSP fork APR v1

on:
  push:
    branches:
      - fxn-convex-pid37-apr-v1
    paths:
      - "fxn-convex-pid37/**"
      - ".github/workflows/fxn-convex-pid37-apr-fork_v1.yml"

permissions:
  contents: read

concurrency:
  group: fxn-convex-pid37-apr-fork-v1
  cancel-in-progress: false

jobs:
  measure-live-fork-apr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - name: Checkout isolated simulation branch
        uses: actions/checkout@v4
        with:
          ref: fxn-convex-pid37-apr-v1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std on GitHub runner
        run: forge install foundry-rs/forge-std --no-git

      - name: Configure isolated Foundry harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fxn-convex-pid37/src
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "fxn-convex-pid37/src"
          test = "fxn-convex-pid37/test"
          out = "out"
          libs = ["lib"]
          solc = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          evm_version = "cancun"
          remappings = ["forge-std/=lib/forge-std/src/"]
          TOML

      - name: Fetch current FXN USD price for APR valuation
        shell: bash
        run: |
          set -euo pipefail
          PRICE_URL="https://coins.llama.fi/prices/current/ethereum:0x365accfca291e7d3914637abf1f7635db165bb09"
          curl -fsS --retry 3 --retry-delay 2 "$PRICE_URL" -o "$RUNNER_TEMP/fxn-price.json"
          python3 - <<'PY'
          import json, time
          path = "${{ runner.temp }}/fxn-price.json"
          key = "ethereum:0x365accfca291e7d3914637abf1f7635db165bb09"
          data = json.load(open(path, "r", encoding="utf-8"))
          coin = data.get("coins", {}).get(key)
          if not coin or not isinstance(coin.get("price"), (int, float)) or coin["price"] <= 0:
              raise SystemExit("DefiLlama did not return a valid FXN/USD price")
          ts = int(coin.get("timestamp", 0))
          if ts == 0 or time.time() - ts > 86400:
              raise SystemExit(f"FXN price is stale: timestamp={ts}")
          price_e8 = int(round(float(coin["price"]) * 100_000_000))
          if price_e8 <= 0:
              raise SystemExit("FXN USD price rounded to zero")
          with open("${{ github.env }}", "a", encoding="utf-8") as f:
              f.write(f"FXN_USD_PRICE_E8={price_e8}\\n")
              f.write(f"FXN_PRICE_TIMESTAMP={ts}\\n")
          print(f"FXN_USD_PRICE={coin['price']}")
          print(f"FXN_USD_PRICE_E8={price_e8}")
          print(f"FXN_PRICE_TIMESTAMP={ts}")
          print(f"FXN_PRICE_SOURCE={coin.get('confidence', 'DefiLlama coins price API')}")
          PY

      - name: Run 1 fxSP deposit, 24-hour fork pause, and real Convex harvest
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path "fxn-convex-pid37/test/FxnConvexPid37AprFork_v1.t.sol" \
            --fork-url "$ETHEREUM_RPC_URL" \
            -vv 2>&1 | tee "$RUNNER_TEMP/fxn-convex-pid37-apr-v1.log"

      - name: Publish measured APR summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Convex f(x) PID 37 — one fxSP fork APR measurement v1"
            echo
            echo "- Fork chain: Ethereum mainnet (chain ID 1)"
            echo "- Deposit: exactly 1.000000000000000000 fxSP"
            echo "- Simulated accrual interval: 24 hours"
            echo "- FXN price source: DefiLlama current token-price API"
            echo
            echo '~~~text'
            grep -E 'FORK_BLOCK|DEPOSIT_FXSP_WEI|ELAPSED_SECONDS|FXN_PRICE_USD_E8|FXSP_NAV_|GAUGE_WEIGHT_E18|FXN_CACHED_RATE|GAUGE_WORKING_SUPPLY|VAULT_WORKING_|POOL_UTILITIES_BOOST|CONVEX_TOTAL_FEE|POOL_UTILITIES_FXN_RATE|ACTUAL_.*FXN_WEI|DIRECT_GAUGE_EXPECTED|POOL_UTILITIES_EXPECTED|APR_BPS|RECONCILIATION|TO_ACTUAL|FEE_SHARE|MATCHES_HARVEST|test_pid37' "$RUNNER_TEMP/fxn-convex-pid37-apr-v1.log" || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fork measurement log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxn-convex-pid37-apr-v1
          path: ${{ runner.temp }}/fxn-convex-pid37-apr-v1.log
          if-no-files-found: warn
          retention-days: 14
