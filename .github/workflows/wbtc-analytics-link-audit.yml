name: WBTC exact dapp analytics browser audit
on:
  push:
    paths:
      - 'CurveYield Markets/WBTC_analytics_audit_request_v1.json'
permissions:
  contents: write
concurrency:
  group: wbtc-analytics-rendered-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser required for JavaScript-only analytics
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render and inspect exact WBTC analytics pages
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          const rows=fs.readFileSync('CurveYield Markets/Verified WBTC Opportunities list_v6.md','utf8').split(/\n/),entries=[];
          for(let i=0;i<rows.length;i++){
           const m=rows[i].match(/^\*\*(\d+)\. ([^—]+) —/);
           if(!m)continue;
           const detail=rows[i+1]||'';
           const u=detail.match(/\*\*Analytics dapp:\*\* (https?:\/\/\S+)/);
           if(!u)continue;
           if(!/not independently extracted/.test(detail))continue;
           entries.push({id:+m[1],name:m[2],url:u[1]});
          }
          let pos=0;let browser;
          const go=async()=>{
           const ctx=await browser.newContext();
           while(pos<entries.length){
            const x=entries[pos++],page=await ctx.newPage(),out={id:x.id,protocol:x.name,url:x.url,status:null,context:{},visible:0,error:null};
            try{
             const resp=await page.goto(x.url,{waitUntil:'domcontentloaded',timeout:20000});
             out.status=resp?.status();
             try{await page.waitForLoadState('networkidle',{timeout:5000})}catch{}
             await page.waitForTimeout(1500);
             const body=(await page.locator('body').innerText({timeout:6000})).replace(/\s+/g,' ');
             out.visible=body.length;
             const labels=['Total Deposits','Total Supply','Total Supplied','Total Value Locked','TVL','Total Collateral','Deposit APY','Supply APY','Net APY','Net APR','Supply APR','Earn APR','Utilization','Available Liquidity','WBTC','Wrapped BTC','WBTC /'];
             for(const label of labels){let j=body.toLowerCase().indexOf(label.toLowerCase());if(j>=0)out.context[label]=body.slice(Math.max(0,j-50),Math.min(body.length,j+200));}
             out.money=(body.match(/\$\s*[\d,.]+\s*[KMB]?/g)||[]).slice(0,16);
             out.rates=(body.match(/[<>]?\s*[\d,.]+\s*%/g)||[]).slice(0,16);
            }catch(e){out.error=String(e.message||e).slice(0,200)}
            console.log('METRIC_INSPECTION '+JSON.stringify(out));
            await page.close().catch(()=>{});
           }
           await ctx.close();
          };
          (async()=>{browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});await Promise.all([go(),go(),go(),go()]);await browser.close();console.log('METRIC_INSPECTION_DONE '+entries.length)})().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          JS
      - name: Confirm read-only metric inspection output
        run: echo 'Dapp metrics inspection evidence is emitted in this job log only'
