name: cyWBTC IPOR + Yearn v18 compile and isolated Ethereum fork simulation
on:
  push:
    branches: [cywbtc-ipor-v18-fork-simulation]
    paths:
      - '.github/workflows/fxusd-yearn-compile-v14.yml'
      - 'fxusd-yearn/compile/v17/Accountant.sol'
      - 'fxusd-yearn/compile/v17/IVault.sol'
      - 'fxusd-yearn/compile/v19/**'
      - 'cywbtc-yearn/v18/**'
      - 'cywbtc-yearn/v19/**'
permissions:
  contents: read
jobs:
  compile-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore source and overlay v19 FXN zero-NAV child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fxusd-compile
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const src=fs.readFileSync('fxusd-yearn/compile/source-v16.b64','utf8').trim();
          const data=JSON.parse(zlib.brotliDecompressSync(Buffer.from(src,'base64')).toString('utf8'));
          for (const [relative,contents] of Object.entries(data)) {
            if (relative.startsWith('/')||relative.includes('..')) throw Error('bad path');
            const out=path.join('.fxusd-compile',relative);
            fs.mkdirSync(path.dirname(out),{recursive:true});
            fs.writeFileSync(out,contents);
          }
          console.log('Restored',Object.keys(data).length,'source and dependency files');
          NODE
          mkdir -p .fxusd-compile/lib .fxusd-compile/node_modules/@yearn-vaults/interfaces
          cp fxusd-yearn/compile/v17/Accountant.sol .fxusd-compile/contracts/Accountant.sol
          cp fxusd-yearn/compile/v17/IVault.sol .fxusd-compile/node_modules/@yearn-vaults/interfaces/IVault.sol
          mkdir -p .fxusd-compile/script
          cp fxusd-yearn/compile/v18/FXNYearnMasterAllocator.sol .fxusd-compile/contracts/FXNYearnMasterAllocator.sol
          cp fxusd-yearn/compile/v19/FXNZeroNAVRewardChild.sol .fxusd-compile/contracts/FXNZeroNAVRewardChild.sol
          cp fxusd-yearn/compile/v19/DeployFXUSDYearnV19.s.sol .fxusd-compile/script/DeployFXUSDYearnV19.s.sol
          git clone --depth 1 -q --branch v4.9.4 https://github.com/OpenZeppelin/openzeppelin-contracts.git .fxusd-compile/lib/openzeppelin
          git clone --depth 1 -q --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .fxusd-compile/node_modules/forge-std
          sed -i 's|@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/|@openzeppelin/contracts/=lib/openzeppelin/contracts/|' .fxusd-compile/foundry.toml
          sed -i '/^remappings = \[/,/^\]/d' .fxusd-compile/foundry.toml
          printf '\nremappings = ["forge-std/=node_modules/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin/contracts/", "@tokenized-strategy/=node_modules/@tokenized-strategy/", "@yearn-vaults/=node_modules/@yearn-vaults/"]\n' >> .fxusd-compile/foundry.toml
      - name: Compile contracts and deployment script (no tests)
        shell: bash
        run: |
          set -euo pipefail
          cd .fxusd-compile
          sed -i 's/function availableWithdrawLimit(address) public view override/function availableWithdrawLimit(address) public view virtual override/' contracts/FXNYearnChildBase.sol
          forge build --use 0.8.30 --via-ir --sizes 2>&1 | tee compile.log
          forge build script/DeployFXUSDYearnV19.s.sol --use 0.8.30 --via-ir 2>&1 | tee -a compile.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=['Accountant','FXNYearnMasterAllocator','CurveConvex32YearnStrategy','FxBaseConvex37YearnStrategy','FXNCurveRewardRouter','FXNZeroNAVRewardChild']
          report={'solc':'0.8.30','optimizer_runs':200,'contracts':{}}
          for name in names:
              found=list(Path('out').rglob(name+'.json'))
              if len(found)!=1: raise RuntimeError(f'missing/duplicate artifact {name}: {found}')
              artifact=json.loads(found[0].read_text())
              runtime=artifact['deployedBytecode']['object'].removeprefix('0x')
              creation=artifact['bytecode']['object'].removeprefix('0x')
              report['contracts'][name]={'runtime_bytes':len(runtime)//2,'creation_bytes':len(creation)//2,'eip170_headroom':24576-len(runtime)//2}
              print(f'FINAL_SIZE {name}: runtime={len(runtime)//2}, creation={len(creation)//2}, eip170_headroom={24576-len(runtime)//2}')
          Path('size-report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Stage cyWBTC v18 simulation deployment script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fxusd-compile/simulation
          cp cywbtc-yearn/v18/script/DeployFXUSDYearnV19.s.sol .fxusd-compile/script/DeployFXUSDYearnV19.s.sol
          sed -i 's|../contracts/yearn/|../contracts/|g' .fxusd-compile/script/DeployFXUSDYearnV19.s.sol
          cp cywbtc-yearn/v19/simulation/run_ethereum_fork_v19.py .fxusd-compile/simulation/
          python3 -m py_compile .fxusd-compile/simulation/run_ethereum_fork_v19.py
          cd .fxusd-compile
          forge build script/DeployFXUSDYearnV19.s.sol --use 0.8.30 --via-ir 2>&1 | tee -a compile.log
      - name: Compile custom v18 fxMINT integrations against pinned official IPOR
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/IPOR-Labs/ipor-fusion.git .ipor-source
          git -C .ipor-source fetch --quiet --depth 1 origin 636bb4c2b78826586a0c0c8c9083c5c285692657
          git -C .ipor-source checkout --detach 636bb4c2b78826586a0c0c8c9083c5c285692657
          mkdir -p .ipor-source/contracts/fuses/fxmint
          cp cywbtc-yearn/v18/contracts/fuses/fxmint/*.sol .ipor-source/contracts/fuses/fxmint/
          cp cywbtc-yearn/v18/contracts/fuses/erc4626/Erc4626SupplyFuse.sol .ipor-source/contracts/fuses/erc4626/Erc4626SupplyFuse.sol
          cd .ipor-source
          npm ci --ignore-scripts --no-audit --no-fund --silent
          git submodule update --init --depth 1 lib/forge-std
          echo "OFFICIAL_PIN $(git rev-parse HEAD)"
          forge build --use 0.8.30 --via-ir --sizes \
            contracts/fuses/fxmint/FXMintBorrowFuse.sol \
            contracts/fuses/fxmint/FXMintCollateralFuse.sol \
            contracts/fuses/fxmint/FXMintAaveV4SpokeAccountingAdapter.sol \
            contracts/fuses/fxmint/FXMintLTVManager_v17.sol \
            contracts/fuses/erc4626/Erc4626SupplyFuse.sol \
            contracts/fuses/erc4626/Erc4626BalanceFuse.sol 2>&1 | tee ipor-v18-compile.log
      - name: Execute v18 isolated Ethereum mainnet-fork lifecycle and state report
        shell: bash
        working-directory: .fxusd-compile
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 || secrets.ETHEREUM_PROVIDER_URL || secrets.ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
          SIM_DEPLOYER_PRIVATE_KEY: ${{ secrets.SIM_LOCAL_FORK_TEST_KEY }}
          SIM_DEPOSITOR: '0x70997970C51812dc3A010C7d01b50e0d17dc79C8'
          VAULT_OWNER: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
          HARVEST_KEEPER: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
          FXUSD: '0x085780639cc2cacd35e474e71f4d000e2405d8f6'
          FXN: '0x365AccFCa291e7D3914637ABf1F7635dB165Bb09'
          WETH: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
          USDC: '0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
          CONVEX_FX_BOOSTER: '0xAffe966B27ba3E4Ebb8A0eC124C7b7019CC762f8'
          CONVEX_FX_POOL_REGISTRY: '0xdb95d646012bb87ac2e6cd63eab2c42323c1f5af'
          CONVEX_FX_GAUGE_32: '0xf1e141c804ba39b4a031fdf46e8c08dba7a0df60'
          CONVEX_FX_GAUGE_37: '0x215d87bd3c7482e2348338815e059de07daf798a'
          CONVEX_FX_GAUGE_8: '0x5b1d12365bec01b8b672ee45912d1bbc86305dba'
          SDFXN: '0xe19d1c837b8a1c83a56cd9165b2c0256d39653ad'
          BOOSTHUB: '0xFbEF8941Da53EA724385B44E91ae9672061D0263'
          FXBASE_POOL: '0x65c9a641afceb9c0e6034e558a319488fa0fa3be'
          CURVE_USDC_FXUSD_POOL: '0x5018be882dcce5e3f2f3b0913ae2096b9b3fb61f'
          CURVE_FXN_WETH_POOL: '0xc15f285679a1ef2d25f53d4cbd0265e1d02f2a92'
          CURVE_WETH_USDC_POOL: '0x7F86Bf177Dd4F3494b841A37e810A34dD56c829B'
          SIM_FXUSD_FUNDER: '0x5018be882dcce5e3f2f3b0913ae2096b9b3fb61f'
          SIM_WBTC_FUNDER: '0x7F86Bf177Dd4F3494b841A37e810A34dD56c829B'
          SIM_IPOR_VAULT: ${{ vars.SIM_IPOR_VAULT }}
          SIM_LTV_MANAGER: ${{ vars.SIM_LTV_MANAGER }}
          SIM_FXMINT_COLLATERAL_FUSE: ${{ vars.SIM_FXMINT_COLLATERAL_FUSE }}
          SIM_FXMINT_ACCOUNTING_ADAPTER: ${{ vars.SIM_FXMINT_ACCOUNTING_ADAPTER }}
          SIM_IPOR_ALPHA: ${{ vars.SIM_IPOR_ALPHA }}
          SIM_LTV_MANAGER_OWNER: ${{ vars.SIM_LTV_MANAGER_OWNER }}
          SIM_PRICE_MIDDLEWARE: ${{ vars.SIM_PRICE_MIDDLEWARE }}
        run: |
          set -euo pipefail
          python3 simulation/run_ethereum_fork_v19.py
      - name: Save compiler output and official source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxusd-v19-sdfxn-timelocked-migration-compile-report
          path: |
            .fxusd-compile/compile.log
            .fxusd-compile/size-report.json
            .fxusd-compile/simulation-output/
            .ipor-source/ipor-v18-compile.log
            .fxusd-compile/contracts/Accountant.sol
            .fxusd-compile/node_modules/@yearn-vaults/interfaces/IVault.sol
          if-no-files-found: warn
          retention-days: 14
