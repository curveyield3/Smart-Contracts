name: cyWBTC Yearn v16 25bps loss-aware source compile
on:
  push:
    branches: [cywbtc-yearn-v16-loss25]
    paths:
      - '.github/workflows/fxusd-yearn-compile-v14.yml'
      - 'cywbtc-yearn/v16/FXMintLTVManager.sol'
      - 'cywbtc-yearn/v16/Erc4626SupplyFuse.sol'
permissions:
  contents: read
jobs:
  compile-manager-and-official-fuses:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore pinned official IPOR source and new LTV manager
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/IPOR-Labs/ipor-fusion.git .ipor-source
          git -C .ipor-source fetch --quiet --depth 1 origin 636bb4c2b78826586a0c0c8c9083c5c285692657
          git -C .ipor-source checkout --detach 636bb4c2b78826586a0c0c8c9083c5c285692657
          mkdir -p .ipor-source/contracts/fuses/fxmint
          cp cywbtc-yearn/v16/FXMintLTVManager.sol .ipor-source/contracts/fuses/fxmint/FXMintLTVManager.sol
          cp cywbtc-yearn/v16/Erc4626SupplyFuse.sol .ipor-source/contracts/fuses/erc4626/Erc4626SupplyFuse.sol
          cd .ipor-source
          npm ci --ignore-scripts --no-audit --no-fund --silent
          git submodule update --init --depth 1 lib/forge-std
          echo "OFFICIAL_PIN $(git rev-parse HEAD)"
          git hash-object contracts/fuses/erc4626/Erc4626SupplyFuse.sol
          git hash-object contracts/fuses/erc4626/Erc4626BalanceFuse.sol
      - name: Compile custom manager and official ERC4626 fuses only (no tests)
        shell: bash
        run: |
          set -euo pipefail
          cd .ipor-source
          forge build --use 0.8.30 --sizes \
            contracts/fuses/fxmint/FXMintLTVManager.sol \
            contracts/fuses/erc4626/Erc4626SupplyFuse.sol \
            contracts/fuses/erc4626/Erc4626BalanceFuse.sol 2>&1 | tee cywbtc-compile.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data={}
          for contract in ['FXMintLTVManager','Erc4626SupplyFuse','Erc4626BalanceFuse']:
              f=list(Path('out').rglob(contract+'.json'))
              if len(f)!=1:raise RuntimeError(f'expected artifact for {contract}: {f}')
              j=json.loads(f[0].read_text())
              runtime=j['deployedBytecode']['object'].removeprefix('0x')
              creation=j['bytecode']['object'].removeprefix('0x')
              data[contract]={'runtime_bytes':len(runtime)//2,'creation_bytes':len(creation)//2,'headroom':24576-len(runtime)//2}
              print('FINAL_SIZE',contract,data[contract])
          Path('cywbtc-sizes.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Package exact official IPOR files and compilation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cywbtc-yearn-v16-loss25-source-and-compile
          path: |
            .ipor-source/contracts/fuses/erc4626/Erc4626SupplyFuse.sol
            .ipor-source/contracts/fuses/erc4626/Erc4626BalanceFuse.sol
            .ipor-source/contracts/fuses/fxmint/FXMintLTVManager.sol
            .ipor-source/cywbtc-compile.log
            .ipor-source/cywbtc-sizes.json
          if-no-files-found: warn
          retention-days: 14
