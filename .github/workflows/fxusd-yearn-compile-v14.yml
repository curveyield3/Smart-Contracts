name: fxUSD Yearn v31 organic 6-day three-harvest Ethereum fork simulation
on:
  push:
    branches: [fxusd-yearn-v31-router-fork-sim]
    paths:
      - '.github/workflows/fxusd-yearn-compile-v14.yml'
      - 'fxusd-yearn/compile/v17/Accountant.sol'
      - 'fxusd-yearn/compile/v17/IVault.sol'
      - 'fxusd-yearn/compile/v19/**'
      - 'fxusd-yearn/compile/v31/**'
permissions:
  contents: read
jobs:
  compile-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Restore source and overlay exact v31 contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fxusd-compile
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const src=fs.readFileSync('fxusd-yearn/compile/source-v16.b64','utf8').trim();
          const data=JSON.parse(zlib.brotliDecompressSync(Buffer.from(src,'base64')).toString('utf8'));
          for (const [relative,contents] of Object.entries(data)) {
            if (relative.startsWith('/')||relative.includes('..')) throw Error('bad path');
            const out=path.join('.fxusd-compile',relative);
            fs.mkdirSync(path.dirname(out),{recursive:true});
            fs.writeFileSync(out,contents);
          }
          console.log('Restored',Object.keys(data).length,'source and dependency files');
          NODE
          mkdir -p .fxusd-compile/lib .fxusd-compile/node_modules/@yearn-vaults/interfaces
          cp fxusd-yearn/compile/v17/Accountant.sol .fxusd-compile/contracts/Accountant.sol
          cp fxusd-yearn/compile/v17/IVault.sol .fxusd-compile/node_modules/@yearn-vaults/interfaces/IVault.sol
          mkdir -p .fxusd-compile/script
          cp fxusd-yearn/compile/v18/FXNYearnMasterAllocator.sol .fxusd-compile/contracts/FXNYearnMasterAllocator.sol
          cp fxusd-yearn/compile/v19/FXNZeroNAVRewardChild.sol .fxusd-compile/contracts/FXNZeroNAVRewardChild.sol
          cp fxusd-yearn/compile/v19/DeployFXUSDYearnV19.s.sol .fxusd-compile/script/DeployFXUSDYearnV19.s.sol
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');
          const data=JSON.parse(zlib.brotliDecompressSync(
            Buffer.from(fs.readFileSync('fxusd-yearn/compile/v31/source-overlay.b64','utf8').trim(),'base64')
          ).toString('utf8'));
          const expected=[
            'contracts/FXNYearnMasterAllocator.sol',
            'contracts/FXNZeroNAVRewardChild.sol',
            'contracts/FXNYearnChildBase.sol',
            'contracts/CurveConvex32YearnStrategy.sol',
            'contracts/FxBaseConvex37YearnStrategy.sol',
            'script/DeployFXUSDYearnV26.s.sol',
            'contracts/CurveYieldOmniRouter_v34.sol',
            'test/FXUSDMainnetForkSimulation.t.sol'
          ];
          if (Object.keys(data).length!==expected.length || expected.some(x=>typeof data[x]!=='string')) throw Error('incomplete v31 fork overlay');
          for(const [relative,contents] of Object.entries(data)){
            if(!expected.includes(relative)) throw Error('unexpected v31 overlay path');
            const out=path.join('.fxusd-compile',relative);
            fs.mkdirSync(path.dirname(out),{recursive:true});
            fs.writeFileSync(out,contents);
          }
          console.log('Applied',expected.length,'exact v31 source overlays');
          NODE
          rm .fxusd-compile/script/DeployFXUSDYearnV19.s.sol
          rm .fxusd-compile/contracts/FXNCurveRewardRouter.sol
          # Extend only the existing fork harness for 3 weekly harvests; production sources unchanged.
          python3 - <<'PY21D'
          # Extend the EXISTING v31 fork harness; no production strategy/router edits.
          from pathlib import Path
          p=Path('.fxusd-compile/test/FXUSDMainnetForkSimulation.t.sol')
          s=p.read_text()
          original='uint256 constant DEPOSIT=50e18;'
          assert s.count(original)==1,'unexpected original harness deposit'
          s=s.replace(original,'uint256 constant DEPOSIT=20000e18;')
          start=s.index('    function _fund() internal {')
          end=s.index('    function _metric(',start)
          s=s[:start]+'''    // Fund only principal; do not seed any FXN principal or backing-child rewards.
              function _fund() internal {
                  require(IERC20(FXUSD).balanceOf(CURVE32)>=DEPOSIT,"fxUSD source insufficient");
                  vm.prank(CURVE32);
                  require(IERC20(FXUSD).transfer(address(this),DEPOSIT),"fork fxUSD principal");
              }
          '''+s[end:]
          sentinel='        _metric(stage,"child37_fxusd_idle",IERC20(FXUSD).balanceOf(address(c37)));'
          assert s.count(sentinel)==1,'accounting field baseline changed'
          s=s.replace(sentinel,sentinel+'''
                  _metric(stage,"child32_fxn_idle",IERC20(FXN).balanceOf(address(c32)));
                  _metric(stage,"child37_fxn_idle",IERC20(FXN).balanceOf(address(c37)));
                  _metric(stage,"fixture_receipt_fxn_idle",IERC20(FXN).balanceOf(address(receipt)));''')
          helper='''    // Static two-day jumps do not publish new Chainlink USDC rounds.
              // Refresh ONLY the read timestamps, never the original price.
              function _freshUSDCPrice(uint256 epoch) internal {
                  address usdcFeed=address(uint160(0x008fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6));
                  (bool ok,bytes memory data)=usdcFeed.staticcall(
                      abi.encodeWithSignature("latestRoundData()")
                  );
                  require(ok && data.length>=160,"USDC oracle read");
                  (uint80 roundId,int256 answer,,,uint80 answeredInRound)=
                      abi.decode(data,(uint80,int256,uint256,uint256,uint80));
                  require(answer>0,"invalid USDC price");
                  vm.mockCall(usdcFeed,abi.encodeWithSignature("latestRoundData()"),
                      abi.encode(roundId,answer,block.timestamp,block.timestamp,answeredInRound));
                  _metric(string.concat("cycle",_weekName(epoch)),"fork_usdc_oracle_answer",uint256(answer));
                  _metric(string.concat("cycle",_weekName(epoch)),"fork_only_oracle_refresh",1);
              }
              function _weekName(uint256 week) internal pure returns(string memory) {
                  if(week==1)return "1";
                  if(week==2)return "2";
                  return "3";
              }
              // Read live Convex claims, then roll back all probe-only state changes.
              function _organicProbe(string memory stage) internal {
                  uint256 checkpoint=vm.snapshotState();
                  vm.prank(address(master));
                  uint256 curve32FXN=c32.claimFxNToMaster();
                  vm.prank(address(master));
                  uint256 fxsp37FXN=c37.claimFxNToMaster();
                  require(vm.revertToState(checkpoint),"organic probe state restoration");
                  _metric(stage,"organic_curve32_fxn",curve32FXN);
                  _metric(stage,"organic_fxsp37_fxn",fxsp37FXN);
                  _metric(stage,"organic_backing_total_fxn",curve32FXN+fxsp37FXN);
              }
          '''
          anchor='    function testForkDeployDepositTimeJumpHarvestWithdrawAccounting() public {'
          assert s.count(anchor)==1,'harness function missing'
          s=s.replace(anchor,helper+anchor)
          start=s.index('        // Establish both positions of the FXN engine')
          end=s.index('        console2.log("AUDIT_COMPLETE_V31"',start)
          replacement='''        // No seed FXN, no backing-child FXN injection, no early staking override.
                  require(IERC20(FXN).balanceOf(address(engine))==0,"economic child seeded");
                  require(engine.convexLPStaked()==0 && receipt.balanceOf(address(engine))==0,
                      "economic child initialized before first harvest");
                  require(IERC20(FXN).balanceOf(address(c32))==0 &&
                      IERC20(FXN).balanceOf(address(c37))==0 &&
                      IERC20(FXN).balanceOf(address(receipt))==0,"backing reward injection");
          
                  // Three master harvests, precisely two days apart. The FXN child
                  // deliberately invests its diverted FXN at the NEXT master harvest.
                  // Model 0.002 FXN/day ONLY during an interval with an active Vyper position.
                  for(uint256 week=1;week<=3;++week) {
                      string memory prefix=string.concat("cycle",_weekName(week));
                      bool stakingActiveAtStart=receipt.balanceOf(address(engine))!=0;
                      uint256 convexStakeAtStart=engine.convexLPStaked();
                      _metric(prefix,"fxn_vyper_staked_at_start",stakingActiveAtStart?1:0);
                      _metric(prefix,"fxn_convex_lp_staked_at_start",convexStakeAtStart);
                      _metric(prefix,"staking_reward_rate_fxn_per_day",0.002e18);
                      _metric(prefix,"full_active_cycle_reward_target_fxn",0.004e18);
                      vm.warp(block.timestamp+2 days);
                      vm.roll(block.number+14400);
                      _freshUSDCPrice(week);
                      uint256 weeklyModeledFXN=stakingActiveAtStart ? 0.004e18 : 0;
                      if(weeklyModeledFXN!=0) {
                          // Explicit fork-only reward model, not organic Convex emissions.
                          // Fund the existing receipt from the live Curve8 FXN balance.
                          require(IERC20(FXN).balanceOf(CURVE8)>=weeklyModeledFXN,
                              "insufficient fork-only FXN fixture reserve");
                          vm.prank(CURVE8);
                          require(IERC20(FXN).transfer(address(receipt),weeklyModeledFXN),
                              "fund modeled Vyper FXN reward");
                      }
                      _metric(prefix,"modeled_vyper_reward_fxn",weeklyModeledFXN);
                      _snapshot(string.concat(prefix,"_preharvest"));
                      _organicProbe(prefix);
                      uint256 sold;
                      uint256 out;
                      bool completed;
                      try master.harvestActive() returns (uint256 fxnSold,uint256 fxusdOut) {
                          sold=fxnSold;
                          out=fxusdOut;
                          completed=true;
                          require(sold>0.02e18 && out>0,"harvest result invariant");
                      } catch (bytes memory reason) {
                          bytes4 selector;
                          if(reason.length>=4){assembly {selector := mload(add(reason,32))}}
                          if(selector!=FXNYearnMasterAllocator.InsufficientLiquidity.selector) {
                              assembly {revert(add(reason,32),mload(reason))}
                          }
                          // Failed atomic harvest leaves balances unchanged; preserve that
                          // state and continue the real fork to the next two-day checkpoint.
                          _metric(prefix,"threshold_blocked",1);
                      }
                      if(week==1) require(completed,"first-week harvest did not complete");
                      _metric(prefix,"harvest_completed",completed?1:0);
                      _metric(prefix,"fxn_sold",sold);
                      _metric(prefix,"fxusd_from_swap",out);
                      _snapshot(string.concat(prefix,"_postharvest"));
                      ITokenizedStrategy(address(master)).report();
                      vault.process_report(address(master));
                      uint256 fees=vault.balanceOf(address(accountant));
                      require(vault.totalSupply()==vault.balanceOf(address(this))+fees,
                          "cycle report share supply conservation");
                      require(vault.totalAssets()>=DEPOSIT,"unexpected principal loss");
                      _metric(prefix,"accountant_fee_shares",fees);
                      _snapshot(string.concat(prefix,"_postreport"));
                  }
                  uint256 userBalanceBefore=IERC20(FXUSD).balanceOf(address(this));
                  address[] memory queue=new address[](1);
                  queue[0]=address(master);
                  uint256 withdrawnShares=vault.balanceOf(address(this))/4;
                  require(withdrawnShares!=0,"no withdrawal shares");
                  uint256 withdrawnFXUSD=vault.redeem(
                      withdrawnShares,address(this),address(this),10_000,queue);
                  _metric("withdraw","shares_burned",withdrawnShares);
                  _metric("withdraw","reported_paid",withdrawnFXUSD);
                  require(withdrawnFXUSD>0 &&
                      IERC20(FXUSD).balanceOf(address(this))>=userBalanceBefore+withdrawnFXUSD,
                      "withdrawal balance mismatch");
                  require(vault.totalSupply()==vault.balanceOf(address(this))+
                      vault.balanceOf(address(accountant)),"post-withdraw shares");
                  _snapshot("postwithdraw");
          '''
          s=s[:start]+replacement+s[end:]
          s=s.replace('AUDIT_COMPLETE_V31','AUDIT_COMPLETE_V31_6D_20K_3HARVEST')
          assert 'DEPOSIT=20000e18' in s
          assert '0.015e18' not in s and '0.08e18' not in s and '0.010e18' not in s
          assert '0.004e18' in s and 'week<=3' in s and '2 days' in s
          p.write_text(s)
          print("MULTICYCLE_FORK_CONFIG deposit=20000 fxUSD; harvest days=2,4,6; staking rate=0.002 FXN/day after staking activation; no backing FXN injection")
          PY21D
          git clone --depth 1 -q --branch v4.9.4 https://github.com/OpenZeppelin/openzeppelin-contracts.git .fxusd-compile/lib/openzeppelin
          git clone --depth 1 -q --branch v1.9.7 https://github.com/foundry-rs/forge-std.git .fxusd-compile/node_modules/forge-std
          git clone --depth 1 -q https://github.com/Uniswap/v4-core.git .fxusd-compile/node_modules/@uniswap/v4-core
          sed -i 's|@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/|@openzeppelin/contracts/=lib/openzeppelin/contracts/|' .fxusd-compile/foundry.toml
          sed -i '/^remappings = \[/,/^\]/d' .fxusd-compile/foundry.toml
          printf '\nremappings = ["forge-std/=node_modules/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin/contracts/", "@tokenized-strategy/=node_modules/@tokenized-strategy/", "@yearn-vaults/=node_modules/@yearn-vaults/"]\n' >> .fxusd-compile/foundry.toml
      - name: Compile contracts and deployment script (no tests)
        shell: bash
        run: |
          set -euo pipefail
          cd .fxusd-compile
          sed -i 's/function availableWithdrawLimit(address) public view override/function availableWithdrawLimit(address) public view virtual override/' contracts/FXNYearnChildBase.sol
          forge build --use 0.8.30 --via-ir --sizes 2>&1 | tee compile.log
          forge build script/DeployFXUSDYearnV26.s.sol --use 0.8.30 --via-ir 2>&1 | tee -a compile.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=['Accountant','FXNYearnMasterAllocator','CurveConvex32YearnStrategy','FxBaseConvex37YearnStrategy','FXNZeroNAVRewardChild']
          report={'solc':'0.8.30','optimizer_runs':200,'contracts':{}}
          for name in names:
              found=list(Path('out').rglob(name+'.json'))
              if len(found)!=1: raise RuntimeError(f'missing/duplicate artifact {name}: {found}')
              artifact=json.loads(found[0].read_text())
              runtime=artifact['deployedBytecode']['object'].removeprefix('0x')
              creation=artifact['bytecode']['object'].removeprefix('0x')
              report['contracts'][name]={'runtime_bytes':len(runtime)//2,'creation_bytes':len(creation)//2,'eip170_headroom':24576-len(runtime)//2}
              print(f'FINAL_SIZE {name}: runtime={len(runtime)//2}, creation={len(creation)//2}, eip170_headroom={24576-len(runtime)//2}')
          Path('size-report-v31.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Execute v31 Ethereum mainnet-fork deposit/timejump/harvest/withdraw simulation
        shell: bash
        run: |
          set -euo pipefail
          cd .fxusd-compile
          export ETH_RPC_URL="${ETH_RPC_URL:-https://ethereum-rpc.publicnode.com}"
          forge test --use 0.8.30 --via-ir --match-contract FXUSDMainnetForkSimulation -vvvv 2>&1 | tee fork-sim.log
      - name: Persist accounting snapshots even if simulation fails
        if: always()
        shell: bash
        run: |
          cd .fxusd-compile
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('fork-sim.log').read_text() if Path('fork-sim.log').exists() else ''
          stages=['postdeploy','postdeposit','cycle1_preharvest','cycle1_postharvest','cycle1_postreport','cycle2_preharvest','cycle2_postharvest','cycle2_postreport','cycle3_preharvest','cycle3_postharvest','cycle3_postreport','postwithdraw','cycle1','cycle2','cycle3','withdraw']
          snapshots={x:{} for x in stages}
          for line in s.splitlines():
              m=re.search(r'AUDIT_(\w+):?\s+(\d+)',line)
              if not m: continue
              k,val=m.group(1),int(m.group(2))
              for stage in stages:
                  if k.startswith(stage+'_'):
                      snapshots[stage][k[len(stage)+1:]]=str(val)
                      break
          meta={'source_revision':'v31','router_revision':'BoostHub v34 exact source',
           'initial_deposit_fxusd':'20000','elapsed_seconds':518400,'harvest_days':[2,4,6],
           'backing_fxn_rewards':'organic Convex only; no injections',
           'economic_child_reward_model':{'token':'FXN','rate_per_day_wei':'2000000000000000',
              'applies_only_when_vyper_position_existed_at_start_of_cycle':True},
           'network':'ethereum mainnet fork (static state, simulated clock)',
           'simulation_only_substitutes':['Vyper/BoostHub receipt','route tail WETH/USDC and USDC/fxUSD',
             'USDC Chainlink timestamp refreshed at original price each cycle',
             'FXN staking yield model funded into receipt on active cycles'],
           'accounting':snapshots,
           'simulator_result':'passed' if '[PASS]' in s else 'failed_or_incomplete'}
          Path('fork-accounting-snapshots-v3.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('ACCOUNTING_SNAPSHOTS',json.dumps({k:len(v) for k,v in snapshots.items()}))
          if meta['simulator_result']=='passed' and any(not snapshots[x] for x in ['postdeploy','postdeposit','cycle1_preharvest','cycle1_postharvest','cycle1_postreport','cycle2_preharvest','cycle2_postharvest','cycle2_postreport','cycle3_preharvest','cycle3_postharvest','cycle3_postreport','postwithdraw']):
              raise SystemExit('successful sim missing required accounting stages')
          PY
      - name: Save compiler output and official source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxusd-v31-v34-6d-3harvest-fork-v2
          path: |
            .fxusd-compile/compile.log
            .fxusd-compile/size-report-v31.json
            .fxusd-compile/fork-sim.log
            .fxusd-compile/fork-accounting-snapshots-v3.json
            .fxusd-compile/test/FXUSDMainnetForkSimulation.t.sol
            .fxusd-compile/contracts/Accountant.sol
            .fxusd-compile/node_modules/@yearn-vaults/interfaces/IVault.sol
          if-no-files-found: warn
          retention-days: 14
