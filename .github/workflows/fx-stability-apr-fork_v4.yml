name: fxSP 4 positions 3 periods fork APR v4

on:
  push:
    branches: [fxn-stability-apr-v4]
    paths:
      - "fxn-convex-pid37/**"
      - ".github/workflows/fx-stability-apr-fork_v4.yml"

permissions:
  contents: read

concurrency:
  group: fxsp-apr-4-by-3-v4
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fxn-stability-apr-v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Foundry test utilities on GitHub runner
        run: forge install foundry-rs/forge-std --no-git

      - name: Configure isolated Solidity harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fxn-convex-pid37/src
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "fxn-convex-pid37/src"
          test = "fxn-convex-pid37/test"
          out = "out"
          libs = ["lib"]
          solc = "0.8.30"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          evm_version = "cancun"
          remappings = ["forge-std/=lib/forge-std/src/"]
          TOML

      - name: Fetch FXN and wstETH prices
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 'https://coins.llama.fi/prices/current/ethereum:0x365accfca291e7d3914637abf1f7635db165bb09,ethereum:0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0' -o "$RUNNER_TEMP/prices.json"
          python3 - <<'PY'
          import json,os,time
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"prices.json"),"r",encoding="utf-8")).get("coins",{})
          for label,token in [("FXN","0x365accfca291e7d3914637abf1f7635db165bb09"),("WSTETH","0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0")]:
              o=p.get("ethereum:"+token,{})
              price=o.get("price")
              ts=int(o.get("timestamp",0))
              if not isinstance(price,(int,float)) or price<=0 or not ts or abs(time.time()-ts)>86400:
                  raise SystemExit(label+" price missing or stale: "+str(o))
              v=int(round(price*100000000))
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
                  f.write(label+"_USD_PRICE_E8="+str(v)+"\n")
              print(label+"_USD="+str(price))
              print(label+"_USD_PRICE_E8="+str(v))
              print(label+"_PRICE_TIMESTAMP="+str(ts))
          PY

      - name: Simulate 1 fxSP deposit in all 4 positions and all 3 periods
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path 'fxn-convex-pid37/test/FxStabilityAprComparison_v4.t.sol' \
            --fork-url "$ETHEREUM_RPC_URL" \
            -vv 2>&1 | tee "$RUNNER_TEMP/fxsp-4x3-fork-v4.log"

      - name: Publish APR and reward amount output
        if: always()
        shell: bash
        run: |
          {
            echo '## fxSP four-position / three-duration fork APR v4'
            echo
            echo 'Deposit: exactly 1.000000000000000000 fxSP per isolated position/period'
            echo
            echo 'Modes: 1 Convex FXN; 2 native FXN; 3 native wstETH; 4 fxSAVE'
            echo
            echo 'Periods: 3600 / 86400 / 259200 seconds'
            echo
            echo 'fxSAVE pool harvesting goes to a separate harvester; unrealized swap profits are not represented as share NAV'
            echo
            echo '~~~text'
            grep -E 'APR_RESULT|MODE|PERIOD_SECONDS|FORK_BLOCK|START_TIMESTAMP|END_TIMESTAMP|DEPOSIT_FXSP_WEI|FXN_PRICE_USD_E8|WSTETH_PRICE_USD_E8|FXSP_NAV|GAUGE_WORKING_BALANCE|USER_FXN_WEI|USER_WSTETH_WEI|CONVEX_FEE_FXN_WEI|POOL_HARVEST_|ATTRIBUTABLE_|INCENTIVE_APR_BPS|CONVEX_GROSS_APR_BPS|FXSAVE_|(PASS|FAIL|Suite result)' "$RUNNER_TEMP/fxsp-4x3-fork-v4.log" || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete measurement log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxsp-4x3-fork-apr-v4
          path: ${{ runner.temp }}/fxsp-4x3-fork-v4.log
          retention-days: 14
          if-no-files-found: warn
