name: One-time Ethereum Opportunities catalog snapshot
on:
  push:
    paths:
      - ".github/workflows/curveyield-ethereum-catalog-snapshot.yml"
permissions:
  contents: write
concurrency:
  group: ethereum-opportunities-catalog-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Download every Ethereum discovery page and save exact worker records
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, time, urllib.request, urllib.error, hashlib
          from pathlib import Path
          ROOT="https://markets.curveyield.org"
          PAGE=500
          out=Path("Curveyield Markets/Ethereum Opportunities Discovery Catalog v1.json")
          def fetch(offset):
              url=f"{ROOT}/api/opportunities?sort=tvl&limit={PAGE}&offset={offset}"
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"CurveYield-SmartContracts-Catalog-Snapshot/1.0","Accept":"application/json"})
                      with urllib.request.urlopen(req,timeout=75) as resp:
                          if resp.status!=200:raise RuntimeError(f"HTTP {resp.status}")
                          body=resp.read(25_000_000)
                      d=json.loads(body)
                      if not isinstance(d,dict) or not isinstance(d.get("opportunities"),list):
                          raise RuntimeError(f"Invalid opportunities response at offset={offset}: {str(d)[:300]}")
                      if d.get("chainId")!=1:raise RuntimeError("Not an Ethereum catalog")
                      return d
                  except Exception as exc:
                      last=exc
                      print(f"offset={offset} network attempt {attempt+1} failed: {exc}",flush=True)
                      if attempt<3:time.sleep(4*(attempt+1))
              raise RuntimeError(f"Unable to fetch offset={offset}: {last}")
          for generation in range(1,9):
              print(f"SNAPSHOT attempt {generation}",flush=True)
              first=fetch(0)
              total=first.get("total")
              stamp=first.get("updatedAt")
              if not isinstance(total,int) or total<=0 or total>100000 or not stamp:
                  raise RuntimeError(f"Invalid catalog metadata total={total}, updatedAt={stamp}")
              pages=[first]
              for offset in range(PAGE,total,PAGE):
                  pages.append(fetch(offset))
              checks=[(p.get("total"),p.get("updatedAt"),len(p["opportunities"])) for p in pages]
              if any(p.get("total")!=total or p.get("updatedAt")!=stamp for p in pages):
                  print("CATALOG_CHANGED_MID_DOWNLOAD; restarting",checks,flush=True)
                  time.sleep(min(10*generation,35))
                  continue
              records=[rec for pg in pages for rec in pg["opportunities"]]
              if len(records)!=total:
                  raise RuntimeError(f"Missing records: downloaded={len(records)} catalog_total={total}; pages={checks}")
              if any(p.get("offset")!=i*PAGE or len(p["opportunities"])!=min(PAGE,total-i*PAGE) for i,p in enumerate(pages)):
                  raise RuntimeError(f"Page positions / lengths are inconsistent: {checks}")
              if any(x.get("chainId")!=1 for x in records):
                  raise RuntimeError("Non-Ethereum opportunities in Ethereum-only catalog")
              serialized=[json.dumps(x,sort_keys=True,ensure_ascii=False,separators=(",",":")) for x in records]
              exact_unique=len(set(serialized))
              if exact_unique!=total:
                  raise RuntimeError(f"Exact duplicate records in API snapshot: unique={exact_unique}, total={total}")
              meta={k:v for k,v in first.items() if k not in ("opportunities","limit","offset","hasMore")}
              meta["catalogDownloadedAtUTC"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
              meta["downloadApi"]=ROOT+"/api/opportunities?sort=tvl&limit=500&offset=<multiple>"
              meta["downloadPageCount"]=len(pages)
              meta["downloadRecordCount"]=len(records)
              meta["workerSnapshotConsistent"]=True
              meta["note"]="All returned opportunities are copied from the worker, unfiltered by asset and unmodified. Dapp URLs in the catalog have not been independently verified as working."
              meta["opportunities"]=records
              out.parent.mkdir(parents=True,exist_ok=True)
              with out.open("w",encoding="utf-8") as f:json.dump(meta,f,ensure_ascii=False,indent=2,allow_nan=False);f.write("\n")
              reopened=json.loads(out.read_text(encoding="utf-8"))
              assert len(reopened["opportunities"])==total
              assert reopened["total"]==total
              print("SNAPSHOT_COMPLETE",json.dumps({"sourceCount":total,"recordsWritten":len(records),"generation":generation,"pages":len(pages),"updatedAt":stamp,"partial":first.get("partial"),"sourceFailures":len(first.get("sourceFailures") or []),"bytes":out.stat().st_size,"sha256":hashlib.sha256(out.read_bytes()).hexdigest()}),flush=True)
              break
          else:
              raise RuntimeError("Catalog changed during each attempt; full consistent snapshot not available")
          PY
      - name: Commit snapshot and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/curveyield-ethereum-catalog-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Curveyield Markets/Ethereum Opportunities Discovery Catalog v1.json" ".github/workflows/curveyield-ethereum-catalog-snapshot.yml"
          git commit -m "Snapshot full Ethereum Markets discovery catalog v1"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "CATALOG_COMMIT_ACCEPTED"
              exit 0
            fi
            sleep 4
          done
          exit 1
