name: One-time Markets v91 eligible opportunity count
on:
  push:
    paths:
      - ".github/workflows/curveyield-markets-v91-live-count.yml"
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Read live filtered catalog status
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,datetime
          u="https://markets.curveyield.org/api/opportunities/status"
          for attempt in range(5):
            try:
              request=urllib.request.Request(u,headers={"Accept":"application/json","User-Agent":"CurveYield-Markets-v91-status-reader"})
              with urllib.request.urlopen(request,timeout=50) as r:
                data=json.loads(r.read(1000000))
              if not isinstance(data.get("count"),int) or not data.get("discoveryFilter"):
                raise RuntimeError("Missing v91 filter marker, got "+str(data)[:350])
              print("VERIFIED_V91_LIVE_COUNT "+json.dumps({"count":data["count"],"filter":data["discoveryFilter"],"sourceUpdatedAt":data.get("updatedAt"),"partial":data.get("partial"),"sourceFailures":data.get("sourceFailures"),"counts":data.get("counts"),"queriedUTC":datetime.datetime.now(datetime.timezone.utc).isoformat()}),flush=True)
              break
            except Exception as ex:
              print("ATTEMPT "+str(attempt+1)+" "+str(ex)[:400],flush=True)
              if attempt==4:raise
              time.sleep(7)
          PY
      - name: Retire this one-time reader
        if: always()
        run: |
          rm -f .github/workflows/curveyield-markets-v91-live-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/curveyield-markets-v91-live-count.yml
          git commit -m "Retire one-time v91 live count reader" || true
          for i in 1 2 3 4; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
