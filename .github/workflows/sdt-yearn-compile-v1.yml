name: SDT Yearn Solidity compile v1

on:
  push:
    paths:
      - "SDTYearn/contracts/**"
      - ".github/workflows/sdt-yearn-compile-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdt-yearn-compile-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout submitted revision
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Configure isolated contract sources
        shell: bash
        run: |
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "SDTYearn/contracts"
          out = "out/sdt-yearn"
          libs = ["lib"]
          solc = "0.8.20"
          optimizer = true
          optimizer_runs = 200
          evm_version = "paris"
          remappings = ["@openzeppelin-4/contracts/=lib/openzeppelin-contracts/contracts/"]
          TOML

      - name: Install pinned upstream OpenZeppelin v4
        run: forge install OpenZeppelin/openzeppelin-contracts@v4.9.6 --no-git

      - name: Compile SDT Yearn production contracts (no tests)
        run: forge build --sizes --root .
