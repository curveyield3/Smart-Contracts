name: One-time live Markets opportunity breakdown
on:
  push:
    paths:
      - ".github/workflows/curveyield-live-opportunity-breakdown.yml"
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all filtered Markets pages and count protocol + deposit asset
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,collections,datetime,time,math
          ROOT="https://markets.curveyield.org"
          def fetch(off):
              url=f"{ROOT}/api/opportunities?sort=asset&limit=500&offset={off}"
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"CurveYield-Eligible-Assets-Inventory/1.0"})
                      with urllib.request.urlopen(req,timeout=105) as response:
                          if response.status!=200:raise ValueError("HTTP "+str(response.status))
                          j=json.load(response)
                      if j.get("discoveryFilter",{}).get("aprGreaterThanPercent")!=1:raise ValueError("Source not v91")
                      if not isinstance(j.get("opportunities"),list):raise ValueError("No opportunities")
                      print("PAGE "+json.dumps({"offset":off,"total":j.get("total"),"updatedAt":j.get("updatedAt"),"records":len(j["opportunities"]),"count":j.get("count"),"partial":j.get("partial"),"failures":j.get("sourceFailures")}),flush=True)
                      return j
                  except Exception as e:
                      print("RETRY "+str(off)+" attempt "+str(attempt+1)+" error "+str(e)[:300],flush=True)
                      if attempt==3:raise
                      time.sleep(4*(attempt+1))
          for generation in range(3):
              p0=fetch(0);total=p0.get("total")
              if not isinstance(total,int) or total<1 or total>10000:raise ValueError("Invalid total "+str(total))
              pages=[p0]
              for off in range(500,total,500):pages.append(fetch(off))
              if any(p.get("total")!=total or p.get("count")!=total or p.get("partial") or p.get("sourceFailures") for p in pages):
                  print("CROSS_PAGE_CHANGED_OR_PARTIAL "+str([(p.get("count"),p.get("total"),p.get("partial")) for p in pages]),flush=True)
                  time.sleep(5);continue
              rows=sum((p["opportunities"] for p in pages),[])
              ids=[r.get("id") for r in rows]
              if len(rows)!=total or len(set(ids))!=total or any(p.get("offset")!=i*500 for i,p in enumerate(pages)):
                  print("INCOMPLETE_LIST "+json.dumps({"len":len(rows),"unique":len(set(ids)),"wanted":total}),flush=True)
                  time.sleep(5);continue
              break
          else:raise RuntimeError("Cannot establish complete filtered inventory")
          by_proto=collections.Counter(r.get("protocol") or "(missing)" for r in rows)
          by_asset=collections.defaultdict(list)
          for r in rows:
              by_asset[(r.get("asset") or "").lower()].append(r)
          assets=[]
          for addr, group in by_asset.items():
              syms=collections.Counter(r.get("assetSymbol") or "(missing)" for r in group)
              symbol=syms.most_common(1)[0][0]
              prots=collections.Counter(r.get("protocol") or "(missing)" for r in group)
              assets.append({"symbol":symbol,"depositToken":addr,"count":len(group),"protocols":dict(sorted(prots.items(),key=lambda kv:(-kv[1],kv[0]))),"symbolVariations":dict(syms)})
          assets.sort(key=lambda x:(-x["count"],x["symbol"].upper(),x["depositToken"]))
          bad={
            "0xe4db1c5a1b709ce4d2ada6985d9d506e58f73829":"Morpho Vault V2 dapp HTTP 404",
            "0x0655977feb2f289a4ab78af67bab0d17aab84367":"Yearn V3 vault 404 on frontend",
            "0xbe53a109b494e5c9f97b9cd39fe969be68bf6204":"Yearn V3 dapp load error"
          }
          known_bad=[{"protocol":r.get("protocol"),"market":r.get("marketName"),"depositAsset":r.get("assetSymbol"),"contract":r.get("address"),"reason":bad.get((r.get("address") or "").lower())} for r in rows if (r.get("address") or "").lower() in bad]
          print("ALL_ASSET_BREAKDOWN "+json.dumps({"timestampUTC":datetime.datetime.now(datetime.timezone.utc).isoformat(),"count":len(rows),"distinctDepositTokenAddresses":len(by_asset),"protocolCount":len(by_proto),"pageCount":len(pages),"sourceUpdatedAt":list(dict.fromkeys(p.get("updatedAt") for p in pages)),"protocols":dict(by_proto),"assets":assets,"knownBadStillListed":known_bad},ensure_ascii=False),flush=True)
          with open(__import__('os').environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"# CurveYield Markets: {len(rows)} opportunity entries, {len(assets)} deposit-token addresses, {len(by_proto)} protocols\n\n")
              f.write("## Protocols\n\n| Protocol | Entries |\n|---|---:|\n")
              for p,n in by_proto.most_common():f.write(f"| {p} | {n} |\n")
              f.write("\n## Deposit assets\n\n| Deposit asset | Entries | Contracts | Protocol coverage |\n|---|---:|---|---|\n")
              for a in assets:f.write(f"| {a['symbol']} | {a['count']} | {a['depositToken']} | {', '.join(a['protocols'])} |\n")
              f.write("\n## Known broken frontends still in v91 inventory\n\n")
              for b in known_bad:f.write(f"- {b['protocol']}: {b['market']} ({b['reason']})\n")
          PY
      - name: Remove one-time audit workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/curveyield-live-opportunity-breakdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/curveyield-live-opportunity-breakdown.yml
          git commit -m "Remove one-time markets live opportunity breakdown" || true
          for retry in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
