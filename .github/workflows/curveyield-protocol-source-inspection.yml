name: One-time native protocol source schema inspection
on:
  push:
    paths:
      - ".github/workflows/curveyield-protocol-source-inspection.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read official protocol source structures without changing code
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,time,concurrent.futures,collections,datetime,ssl
          queries=[
           ("Fluid fToken bulk","https://api.fluid.instadapp.io/v2/lending/1/tokens",None),
           ("Stake DAO Hub vaults","https://hub.stakedao.org/v1/vaults?chainId=1&limit=2&offset=0",None),
           ("Stake DAO native strategies","https://api.stakedao.org/api/strategies/curve/1.json",None),
           ("Beefy vaults","https://api.beefy.finance/vaults",None),
           ("Beefy yields","https://api.beefy.finance/apy",None),
           ("Beefy TVL","https://api.beefy.finance/tvl",None),
           ("Euler EVK V3","https://v3.euler.finance/v3/evk/vaults?chainId=1&limit=3&offset=0",None),
           ("Euler known","https://app.euler.finance/api/public/is-known?chainId=1",None),
           ("Maple GraphQL V2","https://api.maple.finance/v2/graphql",{"query":"{ poolV2S(first:3,skip:0) { id name tvl weeklyApy asset { id symbol decimals } } }"}),
           ("IPOR Fusion","https://api.ipor.io/v2/fusion/vaults",None),
           ("Compound GitHub manifest","https://raw.githubusercontent.com/compound-finance/comet/main/deployments/mainnet/usdc/roots.json",None),
           ("Spark analytics","https://data.spark.finance/sparklend",None)
          ]
          def trim(x):
           if isinstance(x,dict):return {k:trim(v) for k,v in list(x.items())[:16]}
           if isinstance(x,list):return [trim(z) for z in x[:2]]
           return str(x)[:100] if isinstance(x,str) else x
          def inspect(q):
           name,url,payload=q
           try:
            body=json.dumps(payload).encode() if payload else None
            hdr={"User-Agent":"CurveYield-Protocol-Discovery-ReadOnly/1.0","Accept":"application/json, text/html;q=0.8"}
            if payload:hdr["Content-Type"]="application/json"
            req=urllib.request.Request(url,headers=hdr,method="POST" if payload else "GET",data=body)
            with urllib.request.urlopen(req,timeout=30) as resp:
             raw=resp.read(4_000_000);status=resp.status;mime=resp.headers.get("content-type");length=resp.headers.get("content-length")
            try:
             data=json.loads(raw)
             rootType=type(data).__name__
             keys=list(data.keys()) if isinstance(data,dict) else []
             entries=next(((k,v) for k,v in data.items() if isinstance(v,list)),None) if isinstance(data,dict) else None
             sample=data[0] if isinstance(data,list) and data else (entries[1][0] if entries and entries[1] else data)
             counts={"topLevelLength":len(data) if isinstance(data,(list,dict)) else 0,"primaryList":entries[0] if entries else ("root" if isinstance(data,list) else None),"listLength":len(entries[1]) if entries else (len(data) if isinstance(data,list) else None)}
             item={"name":name,"http":status,"bytesRead":len(raw),"contentLength":length,"mime":mime,"rootType":rootType,"topKeys":keys[:25],"counts":counts,"sample":trim(sample)}
            except Exception:
             item={"name":name,"http":status,"bytesRead":len(raw),"mime":mime,"contentSample":raw[:130].decode(errors="replace")}
           except Exception as e:item={"name":name,"error":str(e)[:350]}
           return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
           for item in ex.map(inspect,queries):
            print("SOURCE_INSPECTION "+json.dumps(item,ensure_ascii=False),flush=True)
          PY
      - name: Remove temporary research workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/curveyield-protocol-source-inspection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/curveyield-protocol-source-inspection.yml
          git commit -m "Retire one-time protocol source inspection" || true
          for attempt in 1 2 3 4; do
           git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
           sleep 4
          done
          exit 1
