name: Single protocol live Markets discovery verification
on:
  push:
    paths: [".github/workflows/markets-native-discovery-verify.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROTOCOL: "SparkLend" # v99 canonical /markets/ route
      STAGE: "verify"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium browser
        if: env.STAGE != 'research'
        run: |
          mkdir -p "$RUNNER_TEMP/market-verify"
          cd "$RUNNER_TEMP/market-verify"
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Inspect Fluid fToken native and external rewards
        if: env.PROTOCOL == 'Fluid Lending'
        run: |
          node --input-type=module <<'JS'
          try {
            const res=await fetch('https://api.fluid.instadapp.io/v2/lending/1/tokens',{headers:{accept:'application/json'},signal:AbortSignal.timeout(30000)});
            console.log('FLUID_API_HTTP '+res.status);
            if(!res.ok)throw Error('fluid API denied request '+res.status);
            const j=await res.json();
            for(const v of j.data||[]){
              const a=v.asset||{},out={symbol:v.symbol,contract:v.address,assetAddress:v.assetAddress,
                native:v.isNativeUnderlying,supplyRate:v.supplyRate,rewardsRate:v.rewardsRate,
                totalRate:v.totalRate,rewards:v.rewards,
                totalAssets:v.totalAssets,asset:{symbol:a.symbol,price:a.price,decimals:a.decimals,stakingApr:a.stakingApr}};
              console.log('FLUID_NATIVE_RATE '+JSON.stringify(out));
            }
          }catch(e){console.log('FLUID_RATE_INSPECTION_ERROR '+String(e));}
          JS
      - name: Inspect live Euler native EVK response schema and positive vaults
        if: env.PROTOCOL == 'Euler EVK'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://v3.euler.finance/v3/evk/vaults?chainId=1&limit=100&offset=';
          const arr=[];
          for(let off=0;off<500;off+=100){
            const r=await fetch(base+off,{signal:AbortSignal.timeout(30000)});
            if(!r.ok)throw Error('Euler HTTP '+r.status);
            const j=await r.json();
            if(off===0)console.log('EULER_META '+JSON.stringify(j.meta));
            arr.push(...(j.data||[]));
            if(off+100>=j.meta.total)break;
          }
          let good=arr.filter(v=>Number(v.totalSupplyUsd)>10000 && Number(v.supplyApy)>0.0001);
          good.sort((a,b)=>Number(b.totalSupplyUsd)-Number(a.totalSupplyUsd));
          for(let v of good.slice(0,22)){
            console.log('EULER_VAULT '+JSON.stringify({address:v.address,asset:v.asset,name:v.name,apy:v.supplyApy,
             tvl:v.totalSupplyUsd,isEscrow:v.isEscrow,vaultType:v.vaultType,visibility:v.visibility,
             snapshotTimestamp:v.snapshotTimestamp,status:v.status,totalAssets:v.totalAssets}));
          }
          console.log('EULER_RESEARCH_SUMMARY '+JSON.stringify({sampled:arr.length,positive:good.length,visibilityKeys:Array.from(new Set(arr.flatMap(v=>Object.keys(v.visibility||{}))))}));
          JS
      - name: Inspect actual Ethereum Beefy vault metadata, APY, TVL and deposit assets
        if: env.PROTOCOL == 'Beefy Vaults'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const urls=['vaults','apy','tvl'];
          const values=await Promise.all(urls.map(async k=>{
            const r=await fetch('https://api.beefy.finance/'+k,{signal:AbortSignal.timeout(100000)});
            if(!r.ok)throw Error('Beefy '+k+' HTTP '+r.status);
            return r.json();
          }));
          const [vaults,yields,tvls]=values,counts={};
          const eth=vaults.filter(v=>['ethereum','eth'].includes(String(v.chain||v.network).toLowerCase()));
          for(const v of eth){const label=(v.status||'(missing)')+':'+(v.assets?.length??-1);counts[label]=(counts[label]||0)+1;}
          const candidates=eth.filter(v=>v.status==='active'&&Array.isArray(v.assets)&&v.assets.length===1&&
           /^0x[a-f0-9]{40}$/i.test(v.tokenAddress||'')&&/^0x[a-f0-9]{40}$/i.test(v.earnContractAddress||'')&&
           Number(yields[v.id])>Math.expm1(0.01)&&Number.isFinite(Number(yields[v.id]))&&
           Number(yields[v.id])<10&&Number(tvls?.['1']?.[v.id])>100);
          candidates.sort((a,b)=>(Number(tvls?.['1']?.[b.id])||0)-(Number(tvls?.['1']?.[a.id])||0));
          console.log('BEEFY_META '+JSON.stringify({allVaults:vaults.length,ethVaults:eth.length,byStatusAndAssets:counts,candidateCount:candidates.length}));
          for(const v of candidates.slice(0,45))
           console.log('BEEFY_CANDIDATE '+JSON.stringify({id:v.id,name:v.name,token:v.token,
            assets:v.assets,tokenAddress:v.tokenAddress,earnContractAddress:v.earnContractAddress,
            platformId:v.platformId,status:v.status,type:v.type,chain:v.chain,
            tvl:tvls?.['1']?.[v.id],apy:yields[v.id],oracleId:v.oracleId}));
          JS
      - name: Diagnose official Beefy UI hosts and JavaScript loading
        if: env.STAGE == 'diagnose'
        timeout-minutes: 4
        run: |
          cat > "$RUNNER_TEMP/market-verify/beefy-ui.mjs" <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1350,height:850},locale:'en-US'});
          const sites=[
           'https://app.beefy.com/vault/morpho-eth-gauntlet-frontier-usdc',
           'https://app.beefy.finance/vault/morpho-eth-gauntlet-frontier-usdc',
           'https://app.beefy.com/vault/yb-wbtc'
          ];
          for(const url of sites){
           const p=await context.newPage(),errors=[],failed=[];
           p.on('pageerror',e=>errors.push(String(e).slice(0,330)));
           p.on('console',m=>{if(m.type()==='error')errors.push(m.text().slice(0,200))});
           p.on('requestfailed',r=>{if(failed.length<12)failed.push({url:r.url().slice(0,150),err:r.failure()?.errorText})});
           try{
            const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:23000});
            await p.waitForTimeout(11500);
            const body=await p.locator('body').innerText({timeout:5000}).catch(()=>'');
            const html=await p.locator('body').innerHTML({timeout:5000}).catch(()=>'');
            const scripts=await p.locator('script').count();
            console.log('BEEFY_UI_DIAG '+JSON.stringify({url,http:r?.status(),finalUrl:p.url(),title:await p.title(),
             bodyLength:body.length,bodyPreview:body.slice(0,300),htmlLength:html.length,scriptCount:scripts,
             jsErrors:errors.slice(0,12),requestFailures:failed}));
           }catch(e){console.log('BEEFY_UI_ERROR '+url+' '+String(e))}
           await p.close();
          }
          await context.close();await browser.close();
          JS
          cd "$RUNNER_TEMP/market-verify"
          node beefy-ui.mjs
      - name: Research SparkLend native reserves via official addresses provider
        if: env.PROTOCOL == 'SparkLend' && env.STAGE == 'research'
        timeout-minutes: 4
        run: |
          mkdir -p "$RUNNER_TEMP/market-verify"
          cd "$RUNNER_TEMP/market-verify"
          npm install --no-save --no-audit --no-fund ethers@6.15.0
          node --input-type=module <<'JS'
          import {Interface} from 'ethers';
          const endpoints=['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://eth.drpc.org'];
          let index=0;
          async function rpc(to,data){
            let last;
            for(let k=0;k<endpoints.length;k++){
              const u=endpoints[(index+k)%endpoints.length];
              try{
                const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},
                  body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to,data,gas:'0x1c9c380'},'latest']}),
                  signal:AbortSignal.timeout(14000)});
                const j=await r.json();if(!r.ok||j.error||typeof j.result!=='string')throw Error('RPC '+r.status+' '+JSON.stringify(j.error||j).slice(0,120));
                index=(index+k)%endpoints.length;return j.result;
              }catch(e){last=e}
            }
            throw last;
          }
          const I=new Interface([
            'function getPool() view returns(address)',
            'function getPoolDataProvider() view returns(address)',
            'function getPriceOracle() view returns(address)',
            'function getAllReservesTokens() view returns (tuple(string symbol,address tokenAddress)[])',
            'function getReserveData(address) view returns(uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint40)',
            'function getReserveConfigurationData(address) view returns(uint256,uint256,uint256,uint256,uint256,bool,bool,bool,bool,bool)',
            'function getReserveCaps(address) view returns(uint256,uint256)',
            'function getConfiguration(address) view returns(uint256)',
            'function getAssetPrice(address) view returns(uint256)'
          ]);
          async function read(to,method,...args){
            return I.decodeFunctionResult(method,await rpc(to,I.encodeFunctionData(method,args)));
          }
          console.log('SPARK_SELECTORS '+JSON.stringify(Object.fromEntries(['getPool','getPoolDataProvider','getPriceOracle','getAllReservesTokens','getReserveData','getReserveConfigurationData','getReserveCaps','getConfiguration','getAssetPrice'].map(n=>[n,I.getFunction(n).selector]))));
          const provider='0x02c3ea4e34c0cbd694d2adfa2c690eecbc1793ee';
          const pool=(await read(provider,'getPool'))[0],dp=(await read(provider,'getPoolDataProvider'))[0],oracle=(await read(provider,'getPriceOracle'))[0];
          const reserves=(await read(dp,'getAllReservesTokens'))[0];
          console.log('SPARK_REGISTRY '+JSON.stringify({provider,pool,dp,oracle,reserves:reserves.length,at:Date.now()}));
          for(const asset of reserves){
            try{
              const a=asset.tokenAddress;
              const [d,c,cap,p,mask]=await Promise.all([
                read(dp,'getReserveData',a),read(dp,'getReserveConfigurationData',a),read(dp,'getReserveCaps',a),
                read(oracle,'getAssetPrice',a),read(pool,'getConfiguration',a)
              ]);
              const dec=Number(c[0]),sup=Number(d[2])/10**dec,interest=Number(d[5])/1e27*100;
              const bits=BigInt(mask[0]),enabled=(bits>>56n&1n)===1n,
                frozen=(bits>>57n&1n)===1n,paused=(bits>>60n&1n)===1n;
              const tvl=sup*Number(p[0])/1e8;
              console.log('SPARK_RESERVE '+JSON.stringify({token:asset.symbol,address:a,supply: sup,
                tvl,apr:interest,apy:Math.expm1(interest/100)*100,active:enabled,frozen,paused,
                rawSupplyCap:cap[0].toString(),decimals:dec,
                eligible:enabled&&!frozen&&!paused&&interest>1&&tvl>100}));
            }catch(e){console.log('SPARK_RESERVE_ERROR '+asset.symbol+' '+String(e))}
          }
          JS
      - name: Inspect full protocol listing, rates, single token identity and dapp usability
        if: env.STAGE == 'verify'
        timeout-minutes: 9
        run: |
          cat > "$RUNNER_TEMP/market-verify/check.mjs" <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const name=process.env.PROTOCOL,output=process.env.GITHUB_WORKSPACE+'/_native_verification';
          fs.mkdirSync(output,{recursive:true});
          async function get(offset){
            const u='https://markets.curveyield.org/api/opportunities?protocol='+encodeURIComponent(name)+'&limit=500&offset='+offset+'&sort=tvl';
            for(let n=0;n<4;n++){
              try{const r=await fetch(u,{signal:AbortSignal.timeout(105000)});
                if(!r.ok)throw Error('HTTP '+r.status);
                const d=await r.json();
                if(!Array.isArray(d.opportunities)||!Number.isInteger(d.total))throw Error('Invalid catalog');
                return d;
              }catch(e){console.log('RETRY '+n+' '+e);if(n===3)throw e;await new Promise(r=>setTimeout(r,3000))}
            }
          }
          const first=await get(0),records=[...first.opportunities];
          for(let o=500;o<first.total;o+=500){const d=await get(o);if(d.updatedAt!==first.updatedAt)throw Error('Pagination refreshed');records.push(...d.opportunities)}
          if(records.length!==first.total)throw Error('Missing records');
          console.log('CATALOG '+JSON.stringify({name,found:records.length,all:first.count,sourceStatus:first.sourceStatus?.filter(x=>x.name.toLowerCase().includes(name.split(' ')[0].toLowerCase())),sourceFailures:first.sourceFailures}));
          const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1320,height:900},locale:'en-US',serviceWorkers:'block'});
          const checked=Array(records.length);
          let index=0,screen=0;
          await Promise.all(Array.from({length:Math.min(4,Math.max(1,records.length))},async()=>{
           const p=await context.newPage();
           while(index<records.length){
            const i=index++,x=records[i];
            const f={n:i+1,protocol:x.protocol,market:x.marketName,asset:x.assetSymbol,token:x.asset,contract:x.address,rate:x.lendApr,rateType:x.rateType,tvl:x.tvlUsdEstimate,url:x.dappUrl,depositMode:x.depositMode},issues=[];
            if(x.depositMode!=='single-token'||x.additionalAssets?.length||x.lpComposition)issues.push('not-single-token');
            if(!(x.rateType==='APR'?x.lendApr:Math.log1p(x.lendApr/100)*100)>1)issues.push('apr-below-1');
            if(x.dappLinkType!=='detail'||!x.dappUrl)issues.push('invalid-dapp-url');
            if(i<80){
             try{
              const r=await p.goto(x.dappUrl,{waitUntil:'domcontentloaded',timeout:22000});
              await p.waitForTimeout(10500);
              const txt=(await p.locator('body').innerText({timeout:6000}).catch(()=>'')).replace(/\s+/g,' ');
              const ctl=await p.locator('button,[role="button"],a').evaluateAll(els=>els.filter(el=>{const s=getComputedStyle(el),b=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0}).map(el=>(el.innerText||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,80)).filter(Boolean).slice(0,65)).catch(()=>[]);
              const actions=ctl.filter(t=>/deposit|supply|start earning|connect wallet|connect|invest/i.test(t));
              Object.assign(f,{http:r?.status(),title:await p.title().catch(()=>''),finalUrl:p.url(),tokenVisible:txt.toLowerCase().includes(x.assetSymbol.toLowerCase()),controls:actions,text:txt.slice(0,850)});
              if(!r||r.status()>=400||/404.*not found|vault not supported|this page could not be found|this page couldn.t load/i.test(txt.slice(0,900)))issues.push('dapp-not-usable');
              if(!f.tokenVisible)issues.push('token-not-visible');
              if(!actions.length)issues.push('no-deposit-or-wallet-controls');
              if((issues.length||i<2)&&screen++<12)try{const im='dapp-'+(i+1)+'.png';await p.screenshot({path:output+'/'+im,timeout:5000});f.screenshot=im}catch{}
             }catch(e){f.error=String(e);issues.push('page-load-error')}
             await p.goto('about:blank').catch(()=>{});
            }
            f.issues=issues;checked[i]=f;
            console.log('ENTRY '+JSON.stringify(f).slice(0,1800));
           }
           await p.close();
          }));
          await context.close();await browser.close();
          const counts={};for(const f of checked)for(const issue of f.issues)counts[issue]=(counts[issue]||0)+1;
          const group={};for(const f of checked)group[f.asset+'@'+f.token]=(group[f.asset+'@'+f.token]||0)+1;
          console.log('VERIFIED_SUMMARY '+JSON.stringify({protocol:name,total:checked.length,groups:group,issues:counts}));
          fs.writeFileSync(output+'/native-verification-v1.json',JSON.stringify({protocol:name,updatedAt:first.updatedAt,entries:checked,issues:counts},null,2));
          NODE
          cd "$RUNNER_TEMP/market-verify"
          node check.mjs
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-verification-v1
          path: _native_verification/
          if-no-files-found: warn
          retention-days: 5
