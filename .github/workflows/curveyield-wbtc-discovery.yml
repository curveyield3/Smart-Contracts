name: CurveYield WBTC source inventory (one-time)
on:
  push:
    paths:
      - 'CurveYield Markets/WBTC_discovery_request_v1.json'
permissions:
  contents: write
concurrency:
  group: markets-wbtc-source-inventory
  cancel-in-progress: false
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Read complete WBTC-filtered Markets API catalog
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          W='0x2260fac5e5542a773aa44fbcfedf7c193bc2c599'
          BASE='https://markets.curveyield.org/api/opportunities'
          def fetch(conversion):
            rows=[];offset=0;first=None
            while True:
              q=urllib.parse.urlencode(dict(asset=W,conversion=str(conversion),sort='tvl',limit=500,offset=offset))
              req=urllib.request.Request(BASE+'?'+q,headers={'User-Agent':'CurveYield-WBTC-research/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=120) as r: doc=json.load(r)
              if first is None:first=doc
              batch=doc.get('opportunities',[])
              if not isinstance(batch,list) or (doc.get('hasMore') and not batch):raise RuntimeError('invalid pagination')
              rows+=batch;offset+=len(batch)
              if not doc.get('hasMore'):break
              if offset>5000:raise RuntimeError('unexpected pagination')
            if len(rows)!=doc.get('total'):raise RuntimeError('incomplete filtered inventory')
            return rows,first
          def money(v):
            try:return '$'+format(float(v),',.0f')
            except:return 'unavailable'
          def rate(v,k):
            try:return format(float(v),'.2f')+'% '+str(k or 'rate not typed')
            except:return 'unavailable'
          def cat(p,n):
            if p.startswith('Morpho Vault') or p in ('IPOR Fusion','Fluid Smart Lending'):return 'Lending-optimizing vault'
            if p in ('Aave V3','Aave V4','SparkLend','Morpho Blue','Compound II','Compound III','Fraxlend','Euler EVK','CurveLend V1','CurveLend V2','Fluid Lending','Fluid Vaults'):return 'Lending market'
            if p in ('Yearn V2','Yearn V3','Yearn Vaults','Beefy Vaults','Convex Finance','Stake DAO','Stake DAO Lockers','Maple Syrup','Maple Finance'):return 'Yield-bearing vault / pooled strategy'
            return 'Unclassified'
          direct,doc=fetch(0)
          all_,_=fetch(1)
          if any(x.get('asset','').lower()!=W for x in direct):raise RuntimeError('unexpected non-WBTC direct entry')
          key=lambda x:(x.get('protocol'),x.get('address'),x.get('marketName'),x.get('asset'))
          keys={key(x) for x in direct}
          indirect=[x for x in all_ if key(x) not in keys]
          records=[(x,'direct WBTC') for x in direct]+[(x,'WBTC LP/basket conversion') for x in indirect]
          out=['# Verified WBTC Opportunities list — Ethereum — v1','',
          '> **Verification state:** All filtered discovery records indexed; dedicated dapp TVL, APR/APY, and utilization are marked **UNVERIFIED** until independently checked. A generated market-specific link is not proof that reported values match.','',
          '**Retrieved (UTC):** '+datetime.now(timezone.utc).isoformat(timespec='seconds')+' · **Catalog updated:** '+str(doc.get('updatedAt'))+' · **Token:** WBTC '+W,
          '**Entries:** '+str(len(direct))+' direct WBTC; '+str(len(indirect))+' conversion/basket candidates; '+str(len(records))+' total. **Catalog partial:** '+str(doc.get('partial'))+'. Every filtered API page retrieved.','',
          'Source: https://markets.curveyield.org/opportunities · API: '+BASE+'?asset='+W+'&conversion=0','',
          'Compound III WBTC collateral in USDC/USDT base-asset markets **does not earn interest** (per Compound documentation). WBTC conversion/basket candidates are not direct WBTC deposits.','']
          for i,(x,mode) in enumerate(records,1):
            p=str(x.get('protocol') or 'Unknown');name=str(x.get('marketName') or 'Unnamed').replace('|','/').replace('\n',' ')
            asset=str(x.get('asset') or 'unknown');link=str(x.get('dappUrl') or '')
            label='['+name+']('+link+')' if link.startswith('https://') else name+' (exact dapp unresolved)'
            category=cat(p,name)
            note=''
            if p=='Compound III' and asset.lower()==W:
              category='Collateral-only lending-market listing (not WBTC interest-bearing)'
              note=' **DISCREPANCY: WBTC collateral earns no interest in Compound III.**'
            out.append('**'+str(i)+'. '+p+' — '+label+'** · **Category:** '+category+' · **Path:** '+mode+' · **Asset:** '+str(x.get('assetSymbol') or '?')+' '+asset+' · **Contract:** '+str(x.get('address') or 'index only')+' · **Worker TVL:** '+money(x.get('tvlUsdEstimate'))+' · **Worker rate:** '+rate(x.get('lendApr'),x.get('rateType'))+'.'+note)
            out.append('   **Dapp:** '+(link or 'unresolved')+' ('+str(x.get('dappLinkType') or 'no link')+') · **Dapp TVL/APR/APY:** not verified · **Utilization:** not verified · **Match:** pending. **Source API:** '+str(x.get('sourceUrl') or 'index only')+' · **Source rate warning:** '+str(x.get('rateWarning') or 'none')+' · **Deposit mode:** '+str(x.get('depositMode') or 'unspecified')+' · **Match kind:** '+str(x.get('matchKind') or 'direct'))
            out.append('')
          out+=['## Known catalog source failures','']
          out += ['- '+str(e.get('source'))+': '+str(e.get('error')) for e in doc.get('sourceFailures',[])]
          out += ['- '+str(e) for e in doc.get('coverageWarnings',[])]
          f=Path('CurveYield Markets/Verified WBTC Opportunities list_v1.md')
          f.parent.mkdir(parents=True,exist_ok=True);f.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(json.dumps(dict(direct=len(direct),conversions=len(indirect),total=len(records),updatedAt=doc.get('updatedAt'),bytes=f.stat().st_size)))
          PY
      - name: Inspect official dapp HTML for source-specific figures
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, html, json
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          class Readable(HTMLParser):
            def __init__(self): super().__init__();self.parts=[];self.ignore=0
            def handle_starttag(self,tag,attrs):
              if tag in ('script','style','svg','noscript'):self.ignore+=1
            def handle_endtag(self,tag):
              if tag in ('script','style','svg','noscript'):self.ignore=max(0,self.ignore-1)
            def handle_data(self,data):
              if not self.ignore and data.strip():self.parts.append(data.strip())
          content=Path('CurveYield Markets/Verified WBTC Opportunities list_v1.md').read_text()
          records={}
          for m in re.finditer(r'(?m)^\*\*(\d+)\. ([^—]+) —',content):
            no=int(m.group(1))
            if no < 1:continue
            part=content[m.start():content.find('\n\n',m.start())]
            um=re.search(r'\*\*Dapp:\*\* (https?://\S+) \(',part)
            if um:records[no]=um.group(1)
          def inspect(item):
            n,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; CurveYieldMarketResearch/1.0)','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=22) as r:
                status=r.status;body=r.read(1600000).decode('utf-8','replace');effective=r.url
              p=Readable()
              try:p.feed(body)
              except Exception:pass
              t=' | '.join(p.parts)
              anchors=['Total Deposits','Net APY','Total Supplied','Borrow APY','Utilization','TVL','Total Value Locked','Supply APY','Deposit APY','APY','Assets']
              chunks=[]
              for word in anchors:
                m=re.search(re.escape(word),t,re.I)
                if m:chunks.append(word+': '+t[max(0,m.start()-90):m.start()+210])
              amount=apy=util=None
              def mny(pattern):
                m=re.search(pattern,t,re.I)
                if not m:return None
                mult={'k':1000,'m':1000000,'b':1000000000}.get(m.group(2).lower(),1)
                return float(m.group(1).replace(',',''))*mult
              def pct(pattern):
                m=re.search(pattern,t,re.I)
                return m.group(1).replace(' ','')+'%' if m else None
              if 'app.morpho.org' in effective and '/vault/' in effective:
                amount=mny(r'Total Deposits \| \$([\d,.]+) \| ([kMB])')
                if amount is None:amount=mny(r'Total Deposits \( \| USD \| \) \| \$ \| ([\d,.]+) \| ([kMB])')
                apy=pct(r'Net APY \| (<?[\d. ]+)%')
                if apy is None:apy=pct(r'Net APY \| (<?[\d. ]+) \| %')
              elif 'app.morpho.org' in effective and '/variable/' in effective:
                amount=mny(r'Total market size \| \$([\d,.]+) \| ([kMB])')
                apy=pct(r'Lend Rate \(6h\) \| (<?[\d. ]+)%')
                util=pct(r'Current utilization \| ([\d.]+)%')
              elif 'yearn.fi' in effective and '/vaults/' in effective:
                amount=mny(r'TVL \| TVL \| \$([\d,.]+)\s*([kMB])')
                apy=pct(r'Est\. APY \| Est\. APY \| ([\d.]+)%')
              return dict(i=n,url=effective,status=status,html_bytes=len(body),text_len=len(t),amount=amount,apy=apy,util=util,evidence=chunks[:3],start=t[:100])
            except Exception as e:
              return dict(i=n,url=url,error=str(e)[:300])
          with ThreadPoolExecutor(max_workers=8) as ex:
            outputs=list(ex.map(inspect,records.items()))
          for obj in sorted(outputs,key=lambda x:x['i']):
            print('DAPP_RESEARCH '+json.dumps(obj,ensure_ascii=False))
          results={obj['i']:obj for obj in outputs}
          parts=content.split('\n\n')
          other=[]
          count=0
          for part in parts:
            m=re.match(r'\*\*(\d+)\. ([^—]+) —',part)
            if not m:
              other.append(part)
              continue
            n=int(m.group(1))
            info=results.get(n,{})
            amount=info.get('amount')
            apy=info.get('apy')
            util=info.get('util')
            lines=part.split('\n')
            if len(lines)<2:
              other.append(part)
              continue
            src=re.search(r'Worker TVL:\*\* \$([\d,]+)',lines[0])
            src_amount=float(src.group(1).replace(',','')) if src else None
            l=lines[1].replace('**Dapp TVL/APR/APY:** not verified · **Utilization:** not verified · **Match:** pending.','')
            if amount is not None:
              l += ' · **Dapp TVL/deposits (USD):** '+format(amount,',.0f')
              if src_amount:
                difference=100*(amount/src_amount-1)
                l+=' · **TVL vs worker:** {:+.2f}%'.format(difference)
                if abs(difference)>2:l+=' **MATERIAL DIFFERENCE—check snapshot/basis**'
            else:
              l+=' · **Dapp TVL:** unavailable from HTML'
            if apy:
              l+=' · **Dapp APY:** '+apy
              count+=1 if amount is not None else 0
            else:l+=' · **Dapp APR/APY:** unavailable from HTML'
            if m.group(2).strip() in ('Aave V3','Aave V4','SparkLend','Morpho Blue','Fluid Lending','Compound II','Compound III','CurveLend V1','Fluid Vaults','Euler EVK'):
              l+=' · **Utilization:** '+(util or 'unavailable from HTML')
            l+=' · **Dapp HTTP check:** '+str(info.get('status') or 'unresolved')
            if info.get('error'):l+=' '+str(info['error'])
            if info.get('url') and info.get('url')!=records.get(n):l+=' · **Redirect:** '+str(info['url'])
            if m.group(2).strip()=='Fluid Vaults':
              l+=' · **Category correction:** WBTC borrowing/collateral vault, not a standalone WBTC deposit market'
            if m.group(2).strip()=='CurveLend V1':
              l+=' · **Category correction:** WBTC collateral for crvUSD debt; no WBTC deposit interest established'
            if m.group(2).strip()=='IPOR Fusion' and re.search(r'Carry|Loop|Debt|Yield',lines[0],re.I):
              l+=' · **Category refinement:** leveraged yield/carry vault, not standard lending optimizer'
            lines[1]=l.strip()
            other.append('\n'.join(lines))
          output='\n\n'.join(other).replace('Verified WBTC Opportunities list — Ethereum — v1','Verified WBTC Opportunities list — Ethereum — v2',1)
          output=output.replace('> **Verification state:** All filtered discovery records indexed; dedicated dapp TVL, APR/APY, and utilization are marked **UNVERIFIED** until independently checked. A generated market-specific link is not proof that reported values match.', '> **Verification:** all '+str(len(records))+' dapp-linked discovery records HTTP-checked. '+str(count)+' have TVL and APY extracted directly from dedicated dapp HTML. Other dapp figures are unavailable from static HTML; no claims of verification made. Individual dapp and catalog snapshots can differ.',1)
          dest=Path('CurveYield Markets/Verified WBTC Opportunities list_v2.md')
          dest.write_text(output,encoding='utf-8')
          Path('CurveYield Markets/Verified WBTC Opportunities list_v1.md').unlink()
          print('DAPP_AUDIT_SUMMARY '+json.dumps({'html_tried':len(records),'metrics_extracted':count,'bytes':dest.stat().st_size}))
          PY
      - name: Refine Morpho market figures and final WBTC categories
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, collections
          from pathlib import Path
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor
          
          src=Path('CurveYield Markets/Verified WBTC Opportunities list_v2.md')
          raw=src.read_text(encoding='utf-8')
          lines=raw.splitlines()
          class V(HTMLParser):
            def __init__(self):super().__init__();self.t=[];self.ignore=0
            def handle_starttag(self,tag,attrs):
              if tag in ('script','style','svg','noscript'):self.ignore+=1
            def handle_endtag(self,tag):
              if tag in ('script','style','svg','noscript'):self.ignore=max(0,self.ignore-1)
            def handle_data(self,data):
              if not self.ignore and data.strip():self.t.append(data.strip())
          entries={}
          for i,l in enumerate(lines):
            m=re.match(r'^\*\*(\d+)\. ([^—]+) — ',l)
            if not m:continue
            n=int(m.group(1));data=lines[i+1] if i+1<len(lines) else ''
            match=re.search(r'^\*\*Dapp:\*\* (https?://\S+) \(',data)
            entries[n]=dict(line=i,protocol=m.group(2).strip(),url=match.group(1) if match else None)
          def morpho_fetch(item):
            n,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; WBTC-Verification/1.0)','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=28) as resp:body=resp.read(2000000).decode('utf-8','replace')
              v=V();v.feed(body);t=' | '.join(v.t)
              def numeric(pattern):
                m=re.search(pattern,t,re.I)
                return m.group(1).replace(' ','') if m else None
              def usd(segment):
                idx=t.lower().rfind(segment.lower())
                if idx<0:return None
                after=t[idx+len(segment):idx+len(segment)+110]
                m=re.search(r'\$\s*(?:\|\s*)?([\d,.]+)\s*(?:\|\s*)?([KMB])\b',after,re.I)
                if m:return float(m.group(1).replace(',',''))*dict(k=1000,m=1000000,b=1000000000)[m.group(2).lower()]
                m=re.search(r'\$\s*(?:\|\s*)?([\d,.]+)\b',after)
                return float(m.group(1).replace(',','')) if m else None
              a=usd('Total market size')
              lend=numeric(r'Lend Rate \(6h\)\s*\|\s*([<>]?\s*[\d.]+)\s*(?:\|\s*)?%')
              borrow=numeric(r'Borrow Rate \(6h\)\s*\|\s*([<>]?\s*[\d.]+)\s*(?:\|\s*)?%')
              supplied=usd('Total market size')
              liq=usd('Total Liquidity')
              lltv=numeric(r'Liquidation Loan-To-Value \(LLTV\)\s*\|\s*([\d.]+)\s*(?:\|\s*)?%')
              return n,dict(supplied=supplied,lend=lend,borrow=borrow,liquidity=liq,lltv=lltv)
            except Exception as e:return n,dict(error=str(e)[:140])
          markets=[(n,v['url']) for n,v in entries.items() if v['protocol']=='Morpho Blue' and v['url']]
          with ThreadPoolExecutor(max_workers=6) as ex:
            morpho=dict(ex.map(morpho_fetch,markets))
          for n,result in sorted(morpho.items()):print('MORPHO_VERIFIED '+str(n)+' '+json.dumps(result))
          countbyurl=collections.Counter(v['url'] for v in entries.values() if v['url'])
          aux={
          1:dict(tv='$2.25B supplied',apy='<0.01% supply APY',util='2.0%',extra='$44.97M borrowed, 0.31% variable borrow APY, 81% max LTV, 85% liquidation threshold, 98.2% of supply cap used',url='https://aavetracker.com/markets/ethereum/wbtc/',source="Independent Aave-API mirror, Nov 17 11:40 UTC"),
          3:dict(tv='$132.19M supplied',apy='<0.01% deposit APY',util='0.21%',extra='$272.01K borrowed',url='https://data.spark.finance/sparklend',source="Official Spark Data Hub, Nov 17 00:50 UTC"),
          6:dict(tv='$44.40M supplied',apy='<0.01% supply APY',util='0.6% HUB utilization',extra='$240K borrowed on spoke, borrow base rate 0.28%, 85% collateral factor',url='https://aavetracker.com/v4/spokes/ethereum-main/wbtc/',source="Independent Aave V4 API mirror, Nov 17 15:06 UTC"),
          7:dict(tv='$26.58M supplied',apy='0.00% supply APY',util='0.0% SPOKE utilization',extra='$0 WBTC borrowed; WBTC not borrowable on this spoke',url='https://aavetracker.com/v4/spokes/ethereum-bluechip/',source="Independent Aave V4 API mirror, Nov 17 02:01 UTC"),
          }
          statusflags={20:'RETIRED; MIGRATABLE; withdraw only',56:'RETIRED; MIGRATABLE; withdraw only',59:'RETIRED; MIGRATABLE; withdraw only',60:'RETIRED; MIGRATABLE; withdraw only'}
          smalltv={56:4240,59:1234,60:1065}
          updates=0
          for n,v in entries.items():
            i=v['line'];first=lines[i];detail=lines[i+1]
            if v['protocol']=='Fluid Vaults':
              first=first.replace('**Category:** Lending market','**Category:** WBTC-collateral borrowing vault (not WBTC-earning deposit)')
            if v['protocol'] in ('CurveLend V1','Fraxlend') and ('borrow' in first.lower()):
              first=first.replace('**Category:** Lending market','**Category:** WBTC-collateral debt market (not WBTC-earning deposit)')
            if v['protocol']=='IPOR Fusion' and re.search(r'Carry|Loop|Debt|Yield',first,re.I):
              first=first.replace('**Category:** Lending-optimizing vault','**Category:** Yield-bearing carry / leveraged strategy vault')
            if n in statusflags:detail+=' · **VAULT STATUS:** '+statusflags[n]
            if n in smalltv:
              detail=detail.replace('**Dapp TVL:** unavailable from HTML','**Dapp TVL (USD):** '+chr(36)+format(smalltv[n],',')+' (Yearn official)')
            if countbyurl.get(v['url'],0)>1:
              duplicate=[str(j) for j,w in entries.items() if w['url'] and w['url']==v['url']]
              detail+=' · **DUPLICATE LINK / SHARED OPPORTUNITY:** catalog records #'+', #'.join(duplicate)+' point to the same URL; do not count as distinct investments'
            if n in morpho:
              info=morpho[n]
              if info.get('supplied') is not None:
                amount=info['supplied']
                detail=detail.replace('**Dapp TVL:** unavailable from HTML','**Dapp total market supplied (USD):** '+chr(36)+format(amount,',.0f'))
                src_amount=re.search(r'\*\*Worker TVL:\*\* \$([\d,]+)',first)
                if src_amount:
                  worker=float(src_amount.group(1).replace(',',''))
                  diff=100*(amount/worker-1)
                  detail+=' · **Supplied TVL difference:** {:+.2f}%'.format(diff)
                  if abs(diff)>2:detail+=' **MATERIAL TVL DISCREPANCY** (snapshots and market definitions require review)'
              if info.get('lend') is not None:
                detail=detail.replace('**Dapp APR/APY:** unavailable from HTML','**Dapp lend rate (6h annualized):** '+info['lend']+'%')
              if info.get('borrow'):detail+=' · **Dapp borrow rate (6h):** '+info['borrow']+'%'
              if info.get('liquidity') is not None:detail+=' · **Dapp available liquidity:** '+chr(36)+format(info['liquidity'],',.0f')
              if info.get('lltv'):detail+=' · **Liquidation LTV:** '+info['lltv']+'%'
              if info.get('error'):detail+=' · **Market data recheck error:** '+info['error']
            if n in aux:
              x=aux[n]
              detail+=' · **Additional market stats:** '+x['tv']+', '+x['apy']+', '+x['util']+' utilization; '+x['extra']+' · **Provider:** '+x['source']+' '+x['url']+' (official Spark analytics or independently reproduced Aave API; not identical to dapp HTML)'
            srate=re.search(r'\*\*Worker rate:\*\* (-?[\d.]+)% (APY|APR)',first)
            drate=re.search(r'\*\*Dapp APY:\*\* (-?[\d.]+)%',detail)
            if srate and drate and srate.group(2)=='APY':
              d=float(drate.group(1))-float(srate.group(1))
              if abs(d)>=0.25:detail+=' · **MATERIAL YIELD DISCREPANCY:** {:+.2f} percentage points (worker APY vs exact dapp APY)'.format(d)
              elif abs(d)>=0.01:detail+=' · **Yield difference:** {:+.2f} percentage points'.format(d)
            if n==17:detail+=' · **Yield composition:** native WBTC yield plus ZAMA incentives; 30-day realized APY differs from current incentive-boosted APY'
            if n==12:detail+=' · **Risk:** uncollateralized loan market; unlike collateral-backed WBTC lending'
            if n==45:detail+=' · **Product mismatch:** listing describes borrowing frxUSD secured by WBTC, not a WBTC lending/supply yield'
            lines[i]=first;lines[i+1]=detail;updates+=1
          text='\n'.join(lines).replace('Verified WBTC Opportunities list — Ethereum — v2','Verified WBTC Opportunities list — Ethereum — v3',1)
          text=text.replace('> **Verification:** all 99 dapp-linked discovery records HTTP-checked. 20 have TVL and APY extracted directly from dedicated dapp HTML. Other dapp figures are unavailable from static HTML; no claims of verification made. Individual dapp and catalog snapshots can differ.', '> **Verification status:** All source-filtered records indexed and each linked market-specific dapp HTTP-checked; independent TVL/APY captured directly from 20 app-rendered vault records plus available Morpho Blue market figures and Spark official analytics. Some dapps expose only JavaScript shells; those data are marked missing rather than fabricated. Source and dapp/APIs are sampled at different times. Direct WBTC deposits, collateral-only borrow markets, duplicate source records and WBTC LP/basket conversions are explicitly distinguished. Yield discrepancies >= 0.25 percentage points are flagged.',1)
          text=text.replace('Compound III WBTC collateral in USDC/USDT base-asset markets','Compound III WBTC collateral in USDC/USDT/WETH base-asset markets',1)
          dest=Path('CurveYield Markets/Verified WBTC Opportunities list_v3.md')
          dest.write_text(text+'\n',encoding='utf-8')
          src.unlink()
          print('WBTC_RESEARCH_V3 '+json.dumps(dict(records=updates,morpho_market_count=len(morpho),morpho_tvl_found=sum(z.get('supplied') is not None for z in morpho.values()),morpho_rates_found=sum(z.get('lend') is not None for z in morpho.values()),size=dest.stat().st_size)))
          PY
      - name: Commit source-bound inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'CurveYield Markets/Verified WBTC Opportunities list_v2.md' 'CurveYield Markets/Verified WBTC Opportunities list_v3.md'
          git diff --staged --quiet || { git commit -m "Index all Ethereum WBTC opportunities from Markets API"; git push; }
